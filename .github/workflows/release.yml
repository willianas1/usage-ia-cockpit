# Ao criar uma tag v* (ex.: v0.2.0), gera o exe portátil e o instalador e publica numa Release do GitHub.
# As actions são fixadas pelo SHA do commit (o comentário diz a versão): uma tag pode ser movida, o SHA não.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x

      - name: Instalar Inno Setup
        run: choco install innosetup --version 6.7.1 --no-progress -y

      # O nome da tag nunca entra direto num comando: passa por variável de ambiente e só segue
      # se for uma versão no formato 1.2.3 (com sufixo opcional, ex.: 1.2.3-beta.1).
      - name: Versão a partir da tag
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Tag inválida: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./build.ps1 -Installer -Version $env:VERSION

      - name: Gerar SHA-256
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UsageCockpit-${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
            LICENSE

      - name: Publicar release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/UsageIACockpit-Portable.exe
            dist/UsageIACockpit-Setup-*.exe
            dist/SHA256SUMS.txt
            LICENSE
