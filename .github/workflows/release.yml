# Ao criar uma tag v* (ex.: v0.2.0), gera o exe portátil e o instalador e publica numa Release do GitHub.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Versão a partir da tag
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Installer -Version ${{ steps.ver.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: UsageCockpit-${{ steps.ver.outputs.version }}
          path: dist/*.exe

      - name: Publicar release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/UsageCockpit.exe
            dist/UsageCockpit-Setup-*.exe
