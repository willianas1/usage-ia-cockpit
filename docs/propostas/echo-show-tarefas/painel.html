// ---------- Acesso por PIN (a autorização dos dados é feita no servidor) ----------

var login = document.getElementById('login');
var cockpit = document.getElementById('cockpit');
var pinInput = document.getElementById('pin');
var loginMessage = document.getElementById('login-message');
var loginSubmit = document.getElementById('login-submit');
var keypadButtons = document.querySelectorAll('#keypad button');
var lockRetry = document.getElementById('lock-retry');
var authBusy = false, retryUntil = 0, retryTimer, logoutPending = false;

function updateLoginControls() {
  var waiting = Date.now() < retryUntil;
  for (var i = 0; i < keypadButtons.length; i++) keypadButtons[i].disabled = authBusy || waiting || logoutPending;
  loginSubmit.disabled = authBusy || waiting || logoutPending || pinInput.value.length < 8;
  loginSubmit.textContent = authBusy ? 'Aguarde…' : 'Entrar';
  lockRetry.disabled = authBusy;
}

function showLogin(message) {
  unlocked = false;
  monitorProtection.setActive(false);
  requestGeneration++;
  clearTimeout(timer);
  if (usageRequest) usageRequest.abort();
  usageRequest = null;
  state.data = null;
  state.lastUpdatedAt = null;
  state.failed = state.loading = state.refreshing = state.manualRefresh = false;
  // Entrar de novo com o PIN recomeça o ciclo normal.
  idle.key = null; idle.count = 0; idle.asleep = false;
  skewMs = 0;
  aiGauges().concat(healthGauges()).forEach(function (g) {
    g.gaugeReady = g.hasGauge = g.offline = false;
    g.gaugePhase = 'follow';
    g.healthMoving = false;
    g.shown = g.target = 0;
    g.drawnGauge = null;
    g.paint(g, 0, performance.now());
  });
  PROVIDERS.forEach(function (p) {
    var col = cols[p.id];
    col.last = {};
    col.weekTarget = 0;
    moveThermo(col, 0, 'still');
  });
  resetHealth();
  render();
  pinInput.value = '';
  cockpit.hidden = true;
  login.hidden = false;
  loginMessage.textContent = message || 'Digite seu PIN no teclado ao lado.';
  updateLoginControls();
}

function showCockpit() {
  if (logoutPending) return;
  pinInput.value = '';
  login.hidden = true;
  cockpit.hidden = false;
  unlocked = true;
  monitorProtection.setActive(true);
  retryUntil = 0;
  clearTimeout(retryTimer);
  poll();
}

function authRequest(method, body, done) {
  if (authBusy) return;
  authBusy = true;
  updateLoginControls();
  var xhr = new XMLHttpRequest();
  xhr.open(method, '/api/auth', true);
  xhr.timeout = 15000;
  xhr.onload = function () {
    authBusy = false;
    var data = {};
    try { data = JSON.parse(xhr.responseText); } catch (e) {}
    done(xhr.status, data, parseInt(xhr.getResponseHeader('Retry-After'), 10) || 0);
    updateLoginControls();
  };
  xhr.onerror = xhr.ontimeout = function () {
    authBusy = false;
    done(0, {}, 0);
    updateLoginControls();
  };
  if (body) xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.send(body ? JSON.stringify(body) : null);
}

function checkSession() {
  authRequest('GET', null, function (status, data) {
    if (status === 200 && data.authenticated === true) showCockpit();
    else showLogin(status === 503 ? 'Configure PANEL_PIN_HASH e PANEL_SESSION_SECRET no servidor.' : status === 200 ? '' : 'Sem conexão. Tente entrar novamente.');
  });
}

function countRetry() {
  var seconds = Math.ceil((retryUntil - Date.now()) / 1000);
  if (seconds <= 0) { loginMessage.textContent = 'Você já pode tentar novamente.'; updateLoginControls(); return; }
  loginMessage.textContent = 'Muitas tentativas. Aguarde ' + Math.ceil(seconds / 60) + ' min para tentar novamente.';
  updateLoginControls();
  retryTimer = setTimeout(countRetry, 1000);
}

function submitPin() {
  if (authBusy || logoutPending || Date.now() < retryUntil || pinInput.value.length < 8) return;
  authRequest('POST', { pin: pinInput.value }, function (status, data, retry) {
    pinInput.value = '';
    if (status === 200 && data.authenticated === true) { showCockpit(); return; }
    if (status === 429) { retryUntil = Date.now() + Math.max(1, retry) * 1000; countRetry(); return; }
    loginMessage.textContent = status === 401 ? 'PIN incorreto. Tente novamente.' : status === 503 && data.error && data.error.code === 'auth_not_configured' ? 'Configure PANEL_PIN_HASH e PANEL_SESSION_SECRET no servidor.' : 'Não foi possível entrar. Verifique a conexão e tente novamente.';
  });
}

function lockPanel() {
  if (authBusy) return;
  logoutPending = true;
  showLogin('Bloqueando painel…');
  authRequest('DELETE', null, function (status) {
    if (status === 200) {
      logoutPending = false;
      lockRetry.hidden = true;
      loginMessage.textContent = 'Painel bloqueado. Digite seu PIN para entrar.';
    } else {
      loginMessage.textContent = 'Não foi possível encerrar a sessão. Tente bloquear novamente.';
      lockRetry.hidden = false;
    }
  });
}

document.getElementById('login-form').addEventListener('submit', function (e) { e.preventDefault(); submitPin(); });
document.getElementById('keypad').addEventListener('click', function (e) {
  var digit = e.target.getAttribute('data-digit');
  if (digit !== null && !authBusy && !logoutPending && Date.now() >= retryUntil && pinInput.value.length < 12) pinInput.value += digit;
  updateLoginControls();
});
document.getElementById('pin-clear').addEventListener('click', function () { pinInput.value = ''; updateLoginControls(); });
document.getElementById('pin-back').addEventListener('click', function () { pinInput.value = pinInput.value.slice(0, -1); updateLoginControls(); });
document.addEventListener('keydown', function (e) {
  if (unlocked || authBusy || logoutPending || Date.now() < retryUntil || e.ctrlKey || e.altKey || e.metaKey) return;
  if (/^[0-9]$/.test(e.key)) { e.preventDefault(); if (pinInput.value.length < 12) pinInput.value += e.key; }
  else if (e.key === 'Backspace') { e.preventDefault(); pinInput.value = pinInput.value.slice(0, -1); }
  else if (e.key === 'Escape') { pinInput.value = ''; }
  else if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') { e.preventDefault(); submitPin(); }
  updateLoginControls();
});
document.getElementById('lock').addEventListener('click', function (e) { e.stopPropagation(); lockPanel(); });
lockRetry.addEventListener('click', lockPanel);

// ---------- Relógio ----------

var clock = document.getElementById('clock');
var dateLabel = document.getElementById('date');
var lastMinute = -1;
var MONTHS = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];
function tick() {
  var d = new Date();
  // Os segundos aparecem como contador pequeno, reiniciando em 00 a cada minuto.
  var t = hhmm(d) + '<small>:' + pad(d.getSeconds()) + '</small>';
  if (clock.innerHTML !== t) clock.innerHTML = t;
  var dateText = DAYS[d.getDay()].toUpperCase() + ', ' + d.getDate() + ' de ' + MONTHS[d.getMonth()];
  if (dateLabel.textContent !== dateText) dateLabel.textContent = dateText;
  // Textos relativos ("reseta em 38min") mudam a cada minuto, sem consultar a rede.
  if (d.getMinutes() !== lastMinute) { lastMinute = d.getMinutes(); render(); renderHealth(); renderTasks(true); }
  setTimeout(tick, 1000 - d.getMilliseconds() + 20);
}

// ---------- Tarefas do Claude Code e do Codex (visão Tarefas) ----------
// Vêm em agents, na mesma resposta do /api/panel. O app desktop lê os arquivos do Claude Code e do
// Codex no PC e envia cada mudança; aqui só se desenha. Pergunta nova e tarefa concluída aparecem
// num aviso que sobe e some no meio da lista (fora da visão Tarefas, no topo); a lista fica no lugar
// de "Mais pesados" (o botão de lista volta à visão anterior).

var VIEW_KEY = 'cockpit.view';
var TMIN = 60000;
var TNAME = { claude: 'Claude', codex: 'Codex' };
var TBOLT = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>';
var TX_ICON = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>';
var TEMPTY_ICON = '<svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>';
var tk = { card: null, banner: null, pops: null, detail: null, all: null, one: null, view: null, sel: null, open: false,
  bannerTimer: 0, bannerTask: null, known: null, last: {} };

function tProvider(id) { for (var i = 0; i < PROVIDERS.length; i++) if (PROVIDERS[i].id === id) return PROVIDERS[i]; return PROVIDERS[0]; }
function tMs(iso) { var t = Date.parse(iso); return isFinite(t) ? t : null; }
function tMins(ms) {
  var m = Math.floor(Math.max(0, ms) / TMIN);
  if (m < 1) return 'agora';
  if (m < 60) return m + ' min';
  return Math.floor(m / 60) + 'h' + (m % 60 ? pad(m % 60) : '');
}
// Tokens: entrada nova (com o que foi gravado no cache) + saída. O cache lido fica só no detalhe.
function tSum(k) { return k ? (num(k.input) || 0) + (num(k.cacheWrite) || 0) + (num(k.output) || 0) : 0; }
// Do último pedido (tokens) e da conversa inteira (conversation; app 0.11 não manda: vale o do pedido).
function tTokens(t) { return tSum(t.tokens); }
function tTotal(t) { return t.conversation ? tSum(t.conversation) : tTokens(t); }
// 850, 4,1K, 49K, 1,2M, 36M.
function fmtTok(n) {
  if (n < 1000) return String(Math.round(n));
  if (n < 1e6) return (n < 10000 ? comma(n / 1000, 1).replace(',0', '') : String(Math.round(n / 1000))) + 'K';
  return (n < 1e7 ? comma(n / 1e6, 1).replace(',0', '') : String(Math.round(n / 1e6))) + 'M';
}
function tQText(t) { var q = t.question; return q.kind === 'permission' && q.tool ? q.tool + ': ' + q.text : q.text; }
// Quanto a tarefa levou, do pedido ao fim, com os segundos: "42 s", "17 min 5 s", "1h 05 min".
function tDuration(t) {
  var a = tMs(t.startedAt), b = tMs(t.endedAt || t.since);
  if (a === null || b === null || b <= a) return '';
  var sec = Math.round((b - a) / 1000), m = Math.floor(sec / 60), h = Math.floor(m / 60);
  if (sec < 60) return Math.max(1, sec) + ' s';
  if (m < 60) return m + ' min' + (sec % 60 ? ' ' + (sec % 60) + ' s' : '');
  return h + 'h ' + pad(m % 60) + ' min';
}
// Custo equivalente pelos preços da API (cost, do app 0.13): US$ 0,42 · US$ 34,98 · < US$ 0,01.
function fmtUsd(v) {
  v = num(v);
  if (v === null) return '--';
  if (v < 0.01) return '< US$ 0,01';
  return 'US$ ' + comma(v, v < 100 ? 2 : 0).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
// Linha de estado; na lista leva o custo da conversa (noCost: na tela da tarefa, que tem cartão próprio).
function tStateLine(t, noCost) {
  var age = now() - (tMs(t.since) || now()), line;
  if (t.state === 'waiting') line = (t.question && t.question.kind === 'permission' ? 'Pede permissão' : 'Aguardando você') + ' · ' + (age < TMIN ? 'agora' : 'há ' + tMins(age));
  else if (t.state === 'running') line = '<b>Executando</b> · ' + tMins(age);
  else {
    var d = tDuration(t);
    line = '<b>Concluída</b> às ' + hhmm(new Date(tMs(t.since) || now())) + (d ? ' · levou ' + d : '');
  }
  return line + (!noCost && t.cost ? ' · <span class="tusd">' + fmtUsd(t.cost.conversation) + '</span>' : '');
}
// Estado curto da lista principal: ✓ verde (concluída), bolinha pulsando na cor da ferramenta
// (executando: laranja Claude Code, verde Codex) ou "Aguardando você".
function tStateShort(t) {
  var age = now() - (tMs(t.since) || now());
  if (t.state === 'waiting') return (t.question && t.question.kind === 'permission' ? 'Pede permissão' : 'Aguardando você') + ' · ' + (age < TMIN ? 'agora' : 'há ' + tMins(age));
  if (t.state === 'running') return '<span class="tpulse p-' + esc(t.provider) + '" aria-label="Executando"></span>' + tMins(age);
  var d = tDuration(t);
  return '<span class="tcheck" aria-label="Concluída">✓</span>às ' + hhmm(new Date(tMs(t.since) || now())) + (d ? ' · levou ' + d : '');
}
// Custo compacto para o bloco dos tokens: $18,03 · $0,50 · <$0,01 · $123.
function fmtUsdShort(v) {
  v = num(v);
  if (v === null) return '--';
  if (v < 0.01) return '<$0,01';
  return '$' + comma(v, v < 100 ? 2 : 0);
}
// state 'plain': só o logo, sem o selo (? ou ✓) — a lista principal mostra o ✓ na linha de estado.
function tIcon(t, state) {
  var p = tProvider(t.provider);
  var plain = state === 'plain';
  state = plain ? t.state : state || t.state;
  return '<span class="tico p-' + esc(t.provider) + '">' + (state === 'running' ? '<span class="spin"></span>' : '') +
    '<svg class="logo" viewBox="0 0 24 24"><path fill="' + p.logoFill + '" d="' + p.logo + '"/></svg>' +
    (plain ? '' : state === 'waiting' ? '<span class="badge">?</span>' : state === 'done' ? '<span class="badge">✓</span>' : '') + '</span>';
}
// Pílula: raio, último pedido (verde) | conversa toda (azul).
function tChip(t) {
  if (!t.tokens) return '';
  return '<span class="tchip" title="tokens do último pedido | da conversa toda (entrada nova + saída)">' + TBOLT +
    '<span class="tl">' + fmtTok(tTokens(t)) + '</span><span class="tsep"></span><span class="tt">' + fmtTok(tTotal(t)) + '</span></span>';
}
function tRow(t, full) {
  var q = t.state === 'waiting' && t.question
    ? '<div class="tq' + (t.question.kind === 'permission' ? ' cmd' : '') + '">' + esc(tQText(t)) + '</div>' : '';
  // Lista da tela principal: cartão com fundo leve na cor da ferramenta; o texto (título em até 2 linhas,
  // estado logo abaixo e a pergunta) começa na borda, com o logo do Claude Code ou do Codex em marca
  // d'água atrás dele, à direita; o bloco dos tokens (último pedido, conversa e custo) fica na ponta.
  if (!full) {
    var stack = t.tokens || t.cost
      ? '<div class="tstack" title="tokens do último pedido / da conversa toda · custo da conversa">' +
        (t.tokens ? '<b class="tl">' + TBOLT + fmtTok(tTokens(t)) + '</b><b class="tt">' + fmtTok(tTotal(t)) + '</b>' : '') +
        (t.cost ? '<b class="tc">' + fmtUsdShort(t.cost.conversation) + '</b>' : '') + '</div>'
      : '';
    var p = tProvider(t.provider);
    var mark = '<span class="tbg" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="' + p.logoFill + '" d="' + p.logo + '"/></svg></span>';
    return '<div class="task trow pv-' + esc(t.provider) + ' ' + (t.state === 'waiting' ? 'ask' : t.state === 'running' ? 'run' : 'done') + (q ? ' hasq' : '') + '" data-id="' + esc(t.id) + '">' +
      '<div class="tx">' + mark + '<div class="tn">' + esc(t.name) + '</div><div class="ts">' + tStateShort(t) + '</div>' + q + '</div>' + stack + '</div>';
  }
  // Na lista estreita da tela da tarefa, o selo de tokens vai numa linha própria, sem apertar o nome.

    '" data-id="' + esc(t.id) + '">' + tIcon(t) + '<div class="tx"><div class="tn">' + esc(t.name) + '</div>' + q +
    '<div class="ts">' + tStateLine(t) + '</div>' + tChip(t) + '</div></div>';
}

// Perguntas, depois execuções (mais antigas primeiro), depois concluídas (mais novas primeiro).
function tList() {
  var a = state.agents, list = a && a.tasks && a.tasks.length ? a.tasks.slice() : [];
  var rank = { waiting: 0, running: 1, done: 2 };
  list = list.filter(function (t) { return t && typeof t.id === 'string' && rank[t.state] !== undefined && typeof t.name === 'string'; });
  return list.sort(function (x, y) {
    if (rank[x.state] !== rank[y.state]) return rank[x.state] - rank[y.state];
    var sx = tMs(x.state === 'done' ? x.since : x.startedAt) || 0, sy = tMs(y.state === 'done' ? y.since : y.startedAt) || 0;
    return x.state === 'done' ? sy - sx : sx - sy;

}
function tFind(id) { var l = tList(); for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i]; return null; }
// Sem envio recente do PC (ou painel em espera): a última lista fica, em cinza.
function tasksOff() { var a = state.agents; return !a || a.hasData !== true || a.online !== true || idle.asleep; }

function setTasksHtml(key, node, html) {
  if (tk.last[key] === html) return;
  tk.last[key] = html;
  node.innerHTML = html;
}

function renderTaskCard(list) {
  var a = state.agents, off = tasksOff(), q = 0, r = 0, d = 0;
  list.forEach(function (t) { if (t.state === 'waiting') q++; else if (t.state === 'running') r++; else d++; });
  var counts = off ? '' : [q ? '<b class="q">' + q + ' pergunta' + (q > 1 ? 's' : '') + '</b>' : '', r ? '<b class="r">' + r + ' rodando</b>' : ''].filter(Boolean).join(' · ');
  var html = '<div class="chead"><span class="sec">Tarefas</span><span class="tcount">' + counts + '</span></div>';
  if (!a || a.hasData !== true) {

  } else if (a.paused) {
    html += '<div class="tempty">' + TEMPTY_ICON + 'Consultas pausadas no PC<small>As tarefas voltam quando o app retomar</small></div>';
  } else if (!list.length) {
    html += '<div class="tempty">' + TEMPTY_ICON + 'Nenhuma tarefa agora<small>Claude Code e Codex parados</small></div>';
  } else {
    // Todas as tarefas; a lista rola com o dedo.
    var rows = '';
    for (var i = 0; i < list.length; i++) rows += tRow(list[i], false);
    var foot = off ? (a.online === false ? 'PC sem enviar · ' + ago(a.receivedAt) : 'em espera') : d ? d + ' concluída' + (d > 1 ? 's' : '') + ' nas últimas 8 h' : '';
    html += '<div class="tlist">' + rows + '</div><div class="tfoot"><span>' + esc(foot) + '</span>' +

  if (tk.card.className !== cls) tk.card.className = cls;
}

function renderTaskDetail(list) {
  if (!tk.open) return;

  var t = tFind(tk.sel) || list[0];
  tk.sel = t.id;
  var groups = { waiting: [], running: [], done: [] }, html = '';
  list.forEach(function (x) { groups[x.state].push(x); });
  [['waiting', 'Aguardando você'], ['running', 'Executando'], ['done', 'Concluídas · 8 h']].forEach(function (g) {
    if (!groups[g[0]].length) return;
    html += '<div class="sec">' + g[1] + ' · ' + groups[g[0]].length + '</div>' + groups[g[0]].map(function (x) { return tRow(x, true); }).join('');
  });
  setTasksHtml('all', tk.all, html);

  var body = '', q = t.question, k = t.tokens || {};
  if (t.state === 'waiting' && q) {
    body += q.kind === 'permission'
      ? '<div class="sec" style="color:#EF9F27">Pede permissão' + (q.tool ? ' · ' + esc(q.tool) : '') + '</div><div class="tdcmd">' + esc(q.text) + '</div>'
      : '<div class="sec" style="color:#EF9F27">' + (q.kind === 'input' ? 'Aguardando você' : 'Pergunta') + '</div><div class="tdq ask">' + esc(q.text) + '</div>';
    if (q.options && q.options.length) {
      body += '<div class="sec">Opções</div><div class="topts">' + q.options.map(function (o) { return '<span>' + esc(o) + '</span>'; }).join('') + '</div>';
    }

  }
  var facts = [['Projeto', t.project || '--'], ['Ferramenta', TNAME[t.provider] || t.provider]];
  var age = now() - (tMs(t.since) || now());
  if (t.state === 'running') facts.push(['Executando há', tMins(age)]);
  if (t.state === 'waiting') facts.push(['Esperando há', tMins(age)]);
  if (t.state === 'done') facts.push(['Concluída às', hhmm(new Date(tMs(t.since) || now()))], ['Duração', tDuration(t) || '--']);
  if (t.tokens) {

      '<div class="kt"><div class="kv"><b class="tl">' + TBOLT + '<span>' + fmtTok(tTokens(t)) + '</span></b><span>último pedido</span></div>' +
      '<div class="kv"><b class="tt">' + fmtTok(tTotal(t)) + '</b><span>conversa toda</span></div></div>' +
      (t.state === 'running' && rate !== null ? '<div class="ks"><b>' + Math.round(rate) + '</b><span>tokens/s agora</span></div>' : '') +
      (limit !== null && limit > 0 ? '<div class="kl"><b>~' + comma(limit, limit < 10 && limit % 1 ? 1 : 0) + '%</b><span>do limite de 5 h</span></div>' : '') + '</div>';
    facts.push(['Saída', fmtTok(num(k.output) || 0)], ['Entrada nova', fmtTok((num(k.input) || 0) + (num(k.cacheWrite) || 0))], ['Cache lido', fmtTok(num(k.cacheRead) || 0)]);
  }
  if (t.cost) {

      '<div><b>' + fmtUsd(t.cost.request) + '</b><span>último pedido</span></div>' +

      '<div class="tsoon">Preço da API do ' + esc(t.cost.model) + ' por tipo de token: entrada, gravação e leitura do cache e saída. ' +
      'Nas assinaturas o limite segue a mesma lógica, mas a fórmula não é publicada.</div>';

    esc((TNAME[t.provider] || t.provider) + (t.project ? ' · ' + t.project : '')) + ' · ' + tStateLine(t, true).replace(/<\/?b>/g, '') + '</div></div></div>' +
    '<div class="tdbody">' + body + '</div>');

}

// Pergunta nova ou tarefa concluída na visão Tarefas: aviso no meio da lista que sobe e some (CSS, 10,4 s).
// Enquanto ele fica parado (5,2 s), a lista atrás escurece para o aviso se destacar.
// A pergunta continua destacada em âmbar na lista enquanto espera. Tocar no aviso abre a tarefa. Na
// visão Mais pesados (sem a lista) ou no layout clássico, vai para o aviso do topo.
function showTaskPop(t, kind) {
  if (kind === 'done') playDoneSound();
  if (!tasksView()) { showBanner(t, kind); return; }
  var name = TNAME[t.provider] || t.provider, pop = document.createElement('div'), head, text, extra;
  if (kind === 'ask') {
    head = (t.question && t.question.kind === 'permission' ? 'Permissão pedida' : 'Pergunta') + ' · ' + name + ' · ' + t.name;
    text = t.question ? tQText(t) : t.name;
    extra = '';
  } else {
    var d = tDuration(t);
    head = 'Concluída · ' + name + (d ? ' · ' + d : '');
    text = t.name;
    extra = tChip(t) + (t.cost ? '<span class="pusd">' + fmtUsd(t.cost.request) + '</span>' : '');
  }
  pop.className = 'tpop ' + kind;
  pop.innerHTML = tIcon(t, kind === 'ask' ? 'waiting' : 'done') + '<div class="tx"><div class="k">' + esc(head) + '</div>' +
    '<div class="m">' + esc(text) + '</div>' + extra + '<span class="hint">toque para ver</span></div>';
  function remove() { if (pop.parentNode) pop.parentNode.removeChild(pop); undimTasks(); }
  pop.addEventListener('click', function (e) { e.stopPropagation(); remove(); openTaskDetail(t.id); });
  pop.addEventListener('animationend', remove);
  pop.addEventListener('webkitAnimationEnd', remove);
  // Segurança: se a animação não terminar (aba oculta, por exemplo), some depois do tempo dela.
  setTimeout(remove, 11500);
  tk.pops.appendChild(pop);
  dimTasks();
}

// Escurece a lista atrás do aviso enquanto ele está parado; clareia quando ele começa a subir e sumir.
var POP_HOLD_MS = 5200, dimUntil = 0;
function dimTasks() {
  dimUntil = Date.now() + POP_HOLD_MS;
  tk.pops.classList.add('dim');
  setTimeout(undimTasks, POP_HOLD_MS + 30);
}
function undimTasks() {
  if (Date.now() < dimUntil && tk.pops.querySelector('.tpop')) return;
  tk.pops.classList.remove('dim');
}

// Compara com a consulta anterior: pergunta nova (ou outra pergunta na mesma tarefa) e tarefa que
// terminou viram aviso. A primeira consulta só registra o estado, sem avisos.
function detectTaskEvents(list) {
  var a = state.agents;
  if (!a || a.online !== true || a.paused) return;
  var seen = {}, ask = null, done = null, t0 = now();
  list.forEach(function (t) {
    var qt = t.question ? t.question.text : '';
    seen[t.id] = { state: t.state, started: t.startedAt, q: qt };
    if (!tk.known) return;
    var k = tk.known[t.id];
    if (t.state === 'waiting' && (!k || k.state !== 'waiting' || k.q !== qt)) ask = ask || t;
    else if (t.state === 'done' && (k ? k.state !== 'done' || k.started !== t.startedAt : t0 - (tMs(t.since) || 0) < 90000)) done = done || t;
  });
  tk.known = seen;
  if (ask) showTaskPop(ask, 'ask');
  else if (done) showTaskPop(done, 'done');
}

// Tokens por segundo embaixo do percentual do Claude e do Codex (visão Tarefas).

}

// Som de tarefa concluída: o "Sino simples" (ding-dong de recepção, uma vez), feito com Web Audio, sem
// arquivo. O navegador só libera som depois de um toque na página: o primeiro toque (o mesmo que liga a
// tela ativa) cria o contexto de áudio; antes disso, a conclusão aparece sem som.
var doneAudio = null;
function unlockDoneSound() {
  if (!doneAudio) {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    try { doneAudio = new Ctx(); } catch (e) { return null; }
  }
  if (doneAudio.state === 'suspended' && doneAudio.resume) doneAudio.resume();
  return doneAudio;
}
function playDoneSound() {
  var c = doneAudio && unlockDoneSound();
  if (!c || c.state !== 'running') return;
  var master = c.createGain(), t = c.currentTime + 0.03;
  master.gain.value = 0.8;
  master.connect(c.destination);
  function tone(t0, freq, dur, peak) {
    var o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  // Sino: fundamental com dois parciais, "ding" (Mi 6) e "dong" (Dó 6).
  function bell(t0, f) { tone(t0, f, 1.4, 0.5); tone(t0, f * 2.76, 0.9, 0.16); tone(t0, f * 5.4, 0.5, 0.07); }
  bell(t, 1318.5);
  bell(t + 0.55, 1046.5);
}

function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function enterFull() {
  var req = root.requestFullscreen || root.webkitRequestFullscreen;
  if (!req) return;
  try {
    var r = req.call(root);
    if (r && r.catch) r.catch(function () {});
  } catch (e) {}
}
function exitFull() {
  var ex = document.exitFullscreen || document.webkitExitFullscreen;
  if (!ex) return;
  try {
    var r = ex.call(document);
    if (r && r.catch) r.catch(function () {});
  } catch (e) {}
}
function onFullChange() {
  var full = isFull();
  fsIcon.setAttribute('d', full ? ICON_EXIT : ICON_ENTER);
  fsButton.setAttribute('aria-label', full ? 'Sair da tela cheia' : 'Tela cheia');
  fit();
}

fsButton.addEventListener('click', function (e) {
  e.stopPropagation();
  if (isFull()) { userExited = true; exitFull(); }
  else { userExited = false; enterFull(); }
});
refreshButton.addEventListener('click', function (e) {
  e.stopPropagation();
  refreshNow();
});
// O navegador costuma exigir um gesto: o primeiro toque em qualquer lugar entra em tela cheia,
// a menos que o usuário tenha saído pelo botão.
document.addEventListener('click', function () {
  if (unlocked && !isFull() && !userExited) enterFull();
});
document.addEventListener('fullscreenchange', onFullChange);
document.addEventListener('webkitfullscreenchange', onFullChange);
window.addEventListener('resize', fit);
// Ao voltar para a aba (ex.: o Echo Show reabriu o Silk), atualiza na hora.
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) { if (unlocked) resumePolling(); else if (!logoutPending) checkSession(); }
});
document.getElementById('health-open').addEventListener('click', function () { setExpanded(true); });
document.getElementById('alerts-back').addEventListener('click', function () { setExpanded(false); });
document.getElementById('hb-procs').addEventListener('click', function (e) {
  var button = e.target && e.target.closest && e.target.closest('[data-sort]');
  if (!button) return;
  var sort = button.getAttribute('data-sort');
  if (sort !== 'mem' && sort !== 'cpu') return;
  processSort = sort;
  renderHealth();
});
// Tocar em qualquer parte do cartão da IA (inclusive em Voltar) volta ao modo normal.
document.getElementById('ai-mini').addEventListener('click', function () { setExpanded(false); });

PROVIDERS.forEach(buildColumn);
buildHealth();
initTasks();
renderHealth();
onFullChange();
render();
tick();
tickGauges();
checkSession();
enterFull();

</script><script>
// Protótipo: painel local (com as mudanças ainda não publicadas) + controles de simulação.
(function () {
  function cmd(name, arg) {
    if (name === 'done') { window.MOCK.done = Date.now(); poll(); }
    else if (name === 'ask') { window.MOCK.ask = Date.now(); poll(); }
    else if (name === 'reset') { window.MOCK.done = window.MOCK.ask = false; tk.known = null; poll(); }
    else if (name === 'open') { if (panelView !== 'tasks') setView('tasks'); openTaskDetail(arg || null); }
    else if (name === 'view') setView(arg);
    else if (name === 'offline') { window.MOCK.offline = !!arg; window.PROTO.offline = !!arg; poll(); }
  }
  window.addEventListener('message', function (e) { var m = e.data; if (m && m.proto === 'cmd') cmd(m.name, m.arg); });
  var h = {};
  location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var q = kv.split('='); if (q[0]) h[q[0]] = decodeURIComponent(q[1] || '1'); });
  setTimeout(function () { if (h.e) cmd(h.e); if (h.t) cmd('open', h.t); }, 1500);
})();

</script>
