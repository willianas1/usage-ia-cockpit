<!-- Gerado a partir do painel publicado (usage-ia-cockpit-echo-show) com dados simulados. Não editar à mão. -->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Painel Echo Show · ajustes da lista (protótipo)</title>
  <style>
/* Tema escuro do UsageCockpit (Palette.cs / App.xaml), em escala para 960×480. */
:root {
  --panel: #0F1216;
  --panel-border: #2D333B;
  --muted: #8B949E;
  --text: #D0D7DE;
  --warn: #EF9F27;
  --ok: #3FB950;
  --danger: #E24B4A;
  --mono: "Cascadia Mono", Consolas, "Roboto Mono", "DejaVu Sans Mono", monospace;
  --sans: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: var(--text);
  font-family: var(--sans);
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* Palco fixo de 960×480; o app.js só ajusta a escala se a janela tiver outro tamanho. */
.panel {
  position: absolute;
  left: 0;
  top: 0;
  width: 960px;
  height: 480px;
  transform-origin: 0 0;
  padding: 4px 18px 14px;
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 14px;
  display: flex;
  flex-direction: column;
}

.cockpit { display: flex; flex: 1; flex-direction: column; min-height: 0; }
.login { display: flex; align-items: center; justify-content: center; gap: 72px; flex: 1; }
.login-copy { width: 400px; }
.login-brand { color: #4C9AFF; font-size: 14px; font-weight: 600; letter-spacing: 2px; }
.login h1 { margin: 16px 0; font-size: 42px; line-height: 1.1; font-weight: 600; }
.login p { color: var(--muted); font-size: 18px; line-height: 1.5; margin: 0; }
.login .login-message { margin-top: 20px; min-height: 54px; max-width: 390px; font-size: 16px; color: var(--warn); }
.login-form { width: 300px; display: flex; flex-direction: column; gap: 10px; }
.login-form label { font-size: 16px; color: var(--muted); }
.login-form input { width: 100%; height: 48px; border: 1px solid var(--panel-border); border-radius: 10px; background: #090C10; color: var(--text); text-align: center; font-size: 26px; letter-spacing: 6px; caret-color: transparent; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keypad button, .login-submit { border: 1px solid var(--panel-border); border-radius: 10px; color: var(--text); background: #1B222C; font-family: var(--sans); cursor: pointer; touch-action: manipulation; }
.keypad button { height: 52px; font-size: 25px; }
#pin-clear, #pin-back { font-size: 16px; }
.login-submit { height: 50px; background: #285EA0; border-color: #407BC4; font-size: 20px; font-weight: 600; }
.keypad button:active, .login-submit:active { background: #35475E; }
.keypad button:disabled, .login-submit:disabled { opacity: 0.5; cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid #4C9AFF; outline-offset: 2px; }

.top {
  height: 72px;
  flex-shrink: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
}

.status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  color: var(--muted);
  white-space: nowrap;
}
.status.right { grid-column: 1; grid-row: 1; justify-content: flex-start; flex-wrap: wrap; row-gap: 0; }
.monitor-status { flex-basis: 100%; margin-top: 3px; font-size: 11px; line-height: 1.2; }
.monitor[data-state="active"] { color: var(--ok); border-color: var(--ok); }
.monitor[data-state="waiting"] { color: var(--warn); }
.monitor[aria-pressed="false"] { color: var(--muted); }
.status-summary { grid-column: 3; grid-row: 1; justify-content: flex-end; min-width: 0; text-align: right; }
.status-copy { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
#updated { overflow: hidden; text-overflow: ellipsis; }
.last-updated { color: #6B7280; font-family: var(--mono); font-size: 11px; line-height: 1.2; }

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #22272E;
  flex: none;
}
.dot.online { background: var(--ok); }
.dot.offline { background: var(--warn); }
.dot.error { background: var(--danger); }
.dot.sleep { background: #6B7280; }

.clock {
  font-family: var(--mono);
  font-weight: 600;
  font-size: 46px;
  line-height: 1;
  color: var(--text);
  letter-spacing: 1px;
}
.clock-wrap { grid-column: 2; grid-row: 1; text-align: center; line-height: 1; }
.clock small { font-size: 17px; color: var(--muted); vertical-align: baseline; letter-spacing: 0; }
.date { margin-top: 3px; color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: 0.8px; }

/* Layout B (com a saúde): topo de 64 px, botões de 40 px e relógio um pouco menor. */
.lb .top { height: 64px; }
.lb .fs, .lb .refresh { width: 40px; height: 40px; padding: 10px; }
.lb .refresh { padding: 8px; }
.lb .clock { font-size: 42px; }
.lb .clock small { font-size: 16px; }
.lb .date { font-size: 12px; }

/* Área abaixo do topo: 920×388 no layout clássico e 920×396 no B.
   Modo normal e tela de alertas ocupam o mesmo espaço. */
.stage { flex: 1; min-height: 0; position: relative; }

/* ---------- Layout clássico (sem a saúde): duas colunas de 410 px e a divisória ---------- */
.columns {
  position: absolute;
  left: 0; top: 0; right: 0; bottom: 0;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  transform-origin: 0 100%;
  transition: opacity 0.25s, transform 0.35s;
}

.column {
  width: 410px;
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.column[hidden], .divider[hidden] { display: none; }
.column.stale { opacity: 0.8; }
.column.offline { opacity: 1; }
.column.offline [data-v="readout"] { fill: var(--muted); }
/* Sobrescreve as cores de faixa aplicadas em linha pelo painel. */
.column.offline .week-row .pct { color: var(--muted) !important; }
.column.offline .bar { background: #23282F; }
.column.offline .bar span { background: var(--muted) !important; }
/* Login expirado no PC: mostrador, semana e termômetro em cinza; o aviso e o texto ficam coloridos. */
.column.login .gauge svg, .column.login .week, .column.login .thermo, .ai.login .hdial { filter: grayscale(1); }
.column.login [data-v="readout"] { fill: var(--muted); }
.column.login [data-v="session-reset"] { color: var(--warn); }

.divider {
  width: 1px;
  align-self: stretch;
  margin: 10px 28px 0;
  background: var(--panel-border);
}

.gwrap { display: flex; flex-direction: column; align-items: center; min-width: 0; }

.gauge {
  position: relative;
  width: 340px;
  height: 272px;
}
.gauge svg { display: block; width: 100%; height: 100%; }

.needle { will-change: transform; }
.provider-hit { cursor: pointer; }
.provider-logo { pointer-events: none; }

/* Anel "em uso": camada própria, só ela gira (barato para a GPU do aparelho). */
.ring {
  position: absolute;
  left: 50%;
  top: 56.25%;
  width: 38.5%;
  margin-left: -19.25%;
  margin-top: -19.25%;
  aspect-ratio: 1;
  display: none;
  will-change: transform;
  animation: spin 1.2s linear infinite;
}
.ring.on { display: block; }
.ring svg { display: block; width: 100%; height: 100%; }
@keyframes spin { to { transform: rotate(360deg); } }

.err {
  position: absolute;
  right: 6px;
  top: 8px;
  width: 26px;
  height: 26px;
  display: none;
}
.err.on { display: block; }

.reset {
  font-size: 20px;
  color: var(--muted);
  margin: 0 0 16px;
  white-space: nowrap;
}
.reset b { font-weight: 400; color: var(--text); }

.week { width: 370px; }
.week-row {
  display: flex;
  justify-content: space-between;
  font-size: 20px;
  color: var(--muted);
  margin-bottom: 6px;
  white-space: nowrap;
}
.week-row .pct { font-family: var(--mono); }

.bar {
  position: relative;
  height: 14px;
  border-radius: 4px;
  overflow: hidden;
  background: linear-gradient(to right,
    #23282F 0 60%, rgba(232, 212, 77, 0.25) 60% 80%, rgba(214, 51, 132, 0.25) 80% 100%);
}
.bar span { position: absolute; top: 0; bottom: 0; }

.fs {
  width: 44px;
  height: 44px;
  padding: 12px;
  border: 1px solid var(--panel-border);
  border-radius: 10px;
  background: #171B21;
  color: var(--text);
}
.fs:active { background: #2A3038; }
.fs svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }

.refresh {
  width: 44px;
  height: 44px;
  padding: 10px;
  border: 1px solid var(--panel-border);
  border-radius: 10px;
  background: #171B21;
  color: var(--text);
}
.refresh:active { background: #2A3038; }
.refresh:disabled { opacity: 0.65; }
.refresh svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
.refresh.loading svg { animation: spin 0.9s linear infinite; }
/* Em espera: o botão que acorda o painel ganha destaque. */
.refresh.wake { border-color: #4C9AFF; color: #4C9AFF; }

/* ---------- Saúde do PC ---------- */
/* Animações só com transform/opacity; o restante muda só quando o valor muda. */

.hdial svg { display: block; width: 100%; height: 100%; }
.hneedle { transition: transform 0.9s cubic-bezier(0.34, 1.4, 0.64, 1), opacity 0.3s; }
.hwarn { position: absolute; display: none; width: 20px; height: 20px; }
.hwarn.on { display: block; }
.hwarn svg { display: block; width: 100%; height: 100%; }

/* PC offline: tudo cinza e ponteiros parados na última leitura. */
.hoff .hneedle, .ai-mini.offline .hneedle { transition: none; }
.hoff [data-d="readout"], .ai-mini.offline [data-d="readout"] { fill: var(--muted); }
.hoff .hv { stroke: #59616B; }
.hoff .hpv { fill: #59616B; }
.hoff .hpb { fill: #2A3038; }
.hoff .hb { stroke: #2A3038; }
.hoff .ht { stroke: #6B7280; }
.hoff .sl { stroke: #59616B; }
.hoff .sf { fill: #59616B; }
.hoff .hwarn path { stroke: #59616B; }
.hoff .hcell .s.w { color: var(--muted); }

/* ---------- Layout B (com a saúde) ---------- */
/* Esquerda: dois cartões de IA de 322×195 (mostrador + termômetro da semana).
   Direita: 4 cartões de saúde (172 px) e, embaixo, Alertas e Mais pesados (216 px). */
.thermo, .hmain { display: none; }
.lb .columns {
  display: grid;
  grid-template-columns: 322px minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
  column-gap: 12px;
  row-gap: 6px;
  align-items: stretch;
}
.lb .divider, .lb .week { display: none; }
.lb .column {
  width: auto;
  min-width: 0;
  min-height: 0;
  grid-column: 1;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 64px;
  column-gap: 6px;
  padding: 4px 10px 6px 6px;
  background: #141920;
  border: 1px solid var(--panel-border);
  border-radius: 12px;
}
.lb #col-claude { grid-row: 1; }
.lb #col-codex { grid-row: 2; }
.lb .columns.single .column { grid-row: 1 / 3; }
.lb .gwrap { justify-content: center; }
.lb .gauge { width: 210px; height: 168px; }
.lb .reset { margin: -2px 0 0; font-size: 13px; line-height: 16px; }

/* Termômetro da semana: cápsula de vidro, mercúrio em degradê (verde → vermelho) e seta com o valor.
   O degradê fica parado; uma tampa da cor do vidro desce/sobe (transform) e revela o mercúrio. */
.lb .thermo { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; }
.thermo .cap { font-size: 10px; line-height: 12px; font-weight: 700; letter-spacing: 1.2px; color: #6B7280; margin-bottom: 2px; }
.thermo svg { display: block; width: 64px; height: 152px; overflow: visible; }
.thermo .when { font-size: 11px; line-height: 13px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
.thermo .tm { will-change: transform; transition: transform 1s cubic-bezier(0.34, 1.25, 0.64, 1), opacity 0.3s; }
.thermo.down .tm { transition: transform 0.45s cubic-bezier(0.55, 0, 1, 0.45), opacity 0.3s; }
.thermo.still .tm { transition: none; }
.column.offline .tm-fill, .column.offline .ttag path { fill: #59616B; }

.lb .hmain {
  display: grid;
  grid-column: 2;
  grid-row: 1 / 3;
  grid-template-rows: 172px minmax(0, 1fr);
  row-gap: 8px;
  min-width: 0;
  min-height: 0;
}
.hmain .hcell { padding: 2px 6px 6px; }
.hmain .hcell .hdial { width: 126px; height: 101px; }
.hmain .hcell .t { margin-top: -6px; line-height: 18px; }
.hmain .hcell .s { line-height: 15px; }
.hmain .hcell .hwarn { right: 6px; top: 6px; }
.hmain .spark { height: 18px; }
.hmain .card { display: flex; flex-direction: column; padding: 8px 12px; }
.sec { font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: 1.4px; color: #6B7280; text-transform: uppercase; white-space: nowrap; }
.chead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
.pcard .sec { margin: 3px 0 6px; }
.alist { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.alist .alert-item { padding: 4px 0; }
.alist .alert-item:first-of-type { padding-top: 2px; }
.alist .alert-item .a { font-size: 13px; line-height: 17px; }
.alist .alert-item .b { font-size: 11px; line-height: 15px; }
.alist .hnote { padding: 8px 2px; font-size: 14px; }
.afoot { display: flex; justify-content: space-between; gap: 8px; margin-top: auto; font-size: 11px; line-height: 14px; color: #6B7280; white-space: nowrap; }
.afoot .e { color: var(--danger); }
/* "+N alertas no detalhe": abre a tela de alertas; a área de toque é maior que o texto. */
.amore { position: relative; flex: none; margin: 0; padding: 0; border: 0; background: none; font: inherit; color: #8FB8FF; cursor: pointer; touch-action: manipulation; }
.amore::before { content: ""; position: absolute; left: -12px; right: -6px; top: -10px; bottom: -7px; }
.hoff .amore { color: var(--muted); }
.pcard .proc { font-size: 13px; line-height: 18px; padding: 2px 0; }
.pcard .chips { margin-top: auto; padding-top: 6px; gap: 4px; }
.pcard .chip { padding: 1px 6px; font-size: 11px; line-height: 16px; }

/* "Ver todos os alertas": sempre visível no cartão de Alertas, com ou sem alertas e mesmo sem dados. */
.health-open {
  flex: none;
  height: 30px;
  padding: 0 10px;
  border: 1px solid var(--panel-border);
  border-radius: 10px;
  background: #171B21;
  color: var(--text);
  font: 600 13px var(--sans);
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  cursor: pointer;
  touch-action: manipulation;
}
.health-open svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.health-open.warn { border-color: rgba(239, 159, 39, 0.7); background: #1B1915; }
.health-open.danger { border-color: rgba(226, 75, 74, 0.7); background: #1B1416; }
.hoff .health-open.warn, .hoff .health-open.danger { border-color: var(--panel-border); background: #171B21; }
.health-open:active, .back:active { background: #2A3038; }

/* Tela de alertas: a IA encolhe para o canto esquerdo; à direita, a lista completa e os detalhes. */
.detail {
  position: absolute;
  left: 0; top: 0; right: 0; bottom: 0;
  display: grid;
  grid-template-columns: 176px minmax(0, 1fr);
  column-gap: 10px;
  padding-top: 2px;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.25s, visibility 0s 0.25s;
}
.expanded .detail { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity 0.3s 0.1s, visibility 0s; }
.expanded .columns { opacity: 0; visibility: hidden; transform: scale(0.32); pointer-events: none; transition: opacity 0.25s, transform 0.35s, visibility 0s 0.35s; }

.ai-mini {
  min-height: 0;
  padding: 6px 8px 8px;
  background: #141920;
  border: 1px solid var(--panel-border);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transform: scale(0.85);
  transform-origin: 0 100%;
  transition: transform 0.35s;
}
.expanded .ai-mini { transform: none; }
.ai { display: flex; flex-direction: column; align-items: center; }
.ai .hdial { width: 135px; height: 108px; }
.ai .line { margin-top: -2px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.ai .line b { font-family: var(--mono); font-weight: 600; color: #4C9AFF; }
.ai-mini.offline .line b { color: var(--muted); }
.back {
  width: 100%;
  height: 44px;
  border: 1px solid var(--panel-border);
  border-radius: 10px;
  background: #171B21;
  color: var(--text);
  font: 600 15px var(--sans);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
}
.back svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* 734×394 ao lado da IA: lista de alertas (flexível) e detalhes (256 px). */
.alerts-screen { display: grid; grid-template-columns: minmax(0, 1fr) 256px; column-gap: 8px; min-height: 0; min-width: 0; }
.alcard, .infocard { display: flex; flex-direction: column; padding: 8px 12px; }
.alcard .chead { margin-bottom: 6px; min-height: 18px; }
.al-status { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; line-height: 16px; color: #6B7280; }
.al-status.e { color: var(--danger); }
/* Até 6 alertas no tamanho cheio; 7 e 8 no compacto; acima disso, rolagem por toque só na lista. */
.al-list { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.al-list::-webkit-scrollbar { width: 5px; }
.al-list::-webkit-scrollbar-thumb { background: #3A4048; border-radius: 3px; }
.al-list .alert-item { padding: 8px 6px 8px 0; }
.al-list .alert-item:first-of-type { padding-top: 2px; }
.al-list .alert-item i { width: 12px; height: 12px; margin: 5px 10px 0 2px; }
.al-list .alert-item .a, .al-list .alert-item .b { white-space: normal; overflow: visible; overflow-wrap: anywhere; }
.al-list .alert-item .a { font-size: 17px; line-height: 22px; }
.al-list .alert-item .b { margin-top: 1px; font-size: 14px; line-height: 18px; }
.al-list.dense .alert-item { padding: 4px 6px 4px 0; }
.al-list.dense .alert-item i { width: 11px; height: 11px; margin-top: 4px; }
.al-list.dense .alert-item .a { font-size: 15px; line-height: 19px; }
.al-list.dense .alert-item .b { margin-top: 0; font-size: 13px; line-height: 16px; }
.hnote.ok.big { padding: 18px 4px; font-size: 22px; font-weight: 600; }
.hnote.ok.big svg { width: 28px; height: 28px; }
.infocard .sec { margin: 1px 0 3px; }
.infocard .sec ~ .sec { margin-top: 10px; }
.infocard .proc { padding: 1px 0; }
.fact { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 1px 0; border-top: 1px solid #1F252D; font-size: 13px; line-height: 18px; }
.fact span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.fact b { flex: none; font-family: var(--mono); font-weight: 600; white-space: nowrap; }
.fact.w b { color: var(--warn); }
.fact.d b { color: #FF7B72; }
.hoff .fact.w b, .hoff .fact.d b { color: var(--muted); }

.hrow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 8px; }
.hcell { position: relative; min-width: 0; padding: 3px 8px 6px; background: #141920; border: 1px solid var(--panel-border); border-radius: 12px; display: flex; flex-direction: column; align-items: center; }
.hcell .hdial { width: 124px; height: 99px; }
.hcell .t { margin-top: -4px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.hcell .s { max-width: 100%; font-size: 12px; line-height: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hcell .s.w { color: var(--warn); }
.hcell .hwarn { right: 8px; top: 8px; }
.spark { display: block; width: 100%; height: 22px; margin-top: 4px; }

.lower { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); column-gap: 8px; min-height: 0; }
.card { min-height: 0; min-width: 0; overflow: hidden; padding: 7px 12px; background: #141920; border: 1px solid var(--panel-border); border-radius: 12px; }
.alert-item { display: flex; padding: 3px 0; border-top: 1px solid #1F252D; }
.alert-item:first-of-type { border-top: 0; padding-top: 2px; }
.alert-item i { flex: none; width: 10px; height: 10px; margin: 4px 9px 0 0; border-radius: 50%; background: var(--warn); }
.alert-item i.d { background: var(--danger); }
.hoff .alert-item i { background: #59616B; }
.alert-item div { min-width: 0; }
.alert-item .a, .alert-item .b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.alert-item .a { font-size: 14px; font-weight: 600; line-height: 18px; }
.alert-item .b { font-size: 12px; line-height: 16px; color: var(--muted); }
.hnote { padding: 14px 4px; font-size: 15px; line-height: 1.4; color: var(--muted); }
.hnote small { display: block; margin-top: 6px; font-size: 13px; color: #6B7280; }
.hnote.ok { display: flex; align-items: center; gap: 10px; color: var(--ok); }
.hnote.ok svg { flex: none; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.hoff .hnote.ok { color: var(--muted); }
.proc { display: grid; grid-template-columns: minmax(0, 1fr) 44px 64px; column-gap: 6px; align-items: center; padding: 2px 0; font-size: 13px; line-height: 18px; }
.proc .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proc .n small { color: #6B7280; }
.proc .v { font-family: var(--mono); text-align: right; color: var(--muted); }
.proc.head { padding: 0 0 2px; font-size: 11px; color: #6B7280; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.chip { padding: 2px 7px; border: 1px solid var(--panel-border); border-radius: 999px; background: #1B222C; font-size: 12px; line-height: 17px; color: var(--muted); white-space: nowrap; }
.chip b { font-weight: 600; color: var(--text); }
.chip.w { border-color: rgba(239, 159, 39, 0.55); }
.chip.w b { color: var(--warn); }
.chip.d { border-color: rgba(226, 75, 74, 0.6); }
.chip.d b { color: #FF7B72; }
.hoff .chip.w, .hoff .chip.d { border-color: var(--panel-border); }
.hoff .chip b, .hoff .chip.w b, .hoff .chip.d b { color: var(--muted); }

/* Saúde: mostradores em duas linhas e ranking na lateral. */
.lb .hmain { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); column-gap: 8px; }
.hrow { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 8px; min-height: 0; }
.health-side { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; }
.health-side .health-open { width: 100%; min-height: 42px; justify-content: space-between; }
.health-side .pcard { flex: 1; }
.proc-sort { display: flex; gap: 4px; margin: 4px 0 8px; }
.proc-sort button { min-height: 36px; flex: 1; padding: 3px 5px; border: 1px solid var(--panel-border); border-radius: 7px; background: #1B222C; color: var(--text); font: 600 12px var(--sans); cursor: pointer; touch-action: manipulation; }
.proc-sort button[aria-pressed="true"] { background: #285EA0; border-color: #4C9AFF; color: #fff; }
.pcard .proc { padding: 4px 0; }
/* A tela de alertas ocupa apenas a área de saúde; a IA permanece no lugar. */
.detail { left: 334px; grid-template-columns: minmax(0, 1fr); padding-top: 0; }
.expanded .columns { opacity: 1; visibility: visible; transform: none; pointer-events: auto; }
.expanded .hmain { visibility: hidden; pointer-events: none; }
.detail .ai-mini, .detail .infocard { display: none; }
.alerts-screen { grid-template-columns: minmax(0, 1fr); }
.alcard .chead { justify-content: flex-start; gap: 12px; }
.alcard .al-status { margin-left: auto; }
.alcard .back { width: auto; flex: none; padding: 0 12px; }

/* Ajustes de espaço para o painel de 960×480: mostradores mantidos, cards mais justos. */
.panel { padding: 4px 10px 7px; }
.lb .columns { grid-template-columns: 340px minmax(0, 1fr); column-gap: 10px; }
.lb .hmain { grid-template-columns: minmax(0, 1.43fr) minmax(0, 1fr); }
.hrow { gap: 6px; }
.hmain .hcell { padding: 7px 3px 4px; }
.hmain .hcell .hdial { width: 154px; height: 123px; flex: none; }
.hmain .hcell .t { margin-top: -3px; flex: none; }
.hmain .hcell .s { margin-top: 2px; font-size: 11px; flex: none; }
.hmain .hcell .hspark { align-self: stretch; width: 100%; margin-top: 4px; flex: none; }
.hmain .spark { height: 20px; margin-top: 0; }
.hmain .hneedle { transition: opacity 0.3s; }
.health-side { padding-top: 8px; }
.health-side .health-open { min-height: 46px; padding: 0 9px; font-size: 11px; gap: 3px; }
.alert-label { display: flex; align-items: center; gap: 5px; min-width: 0; }
.alert-label svg { width: 17px; height: 17px; flex: none; fill: none; stroke: var(--warn); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.health-open.danger .alert-label svg { stroke: var(--danger); }
.health-open:not(.warn):not(.danger) .alert-label svg { visibility: hidden; }
.health-side .pcard { padding: 8px 9px; }
.pcard .proc { grid-template-columns: minmax(0, 1fr) 39px 52px; column-gap: 3px; font-size: 12px; line-height: 18px; padding: 4px 0; }
.pcard .proc.head { font-size: 11px; }
.pcard .proc-sort button { font-size: 11px; padding: 3px; }
.pcard .chips { gap: 3px; }
.pcard .chip { padding: 1px 4px; font-size: 10px; }
.detail { left: 350px; }

/* ---------- Visão Tarefas (layout B): tarefas do Claude Code e do Codex no lugar de "Mais pesados" ----------
   O botão de lista no topo alterna com a visão anterior (Mais pesados); a escolha fica no aparelho.
   .vt só existe junto de .lb. .toff: tarefas sem envio recente do PC (cinza, como o PC offline). */
.top { position: relative; }
.vtoggle { display: none; }
.lb .vtoggle { display: inline-block; }
.vtoggle[aria-pressed="true"] { color: #4C9AFF; border-color: #4C9AFF; }

#hb-tasks { display: none; }
.vt #hb-procs { display: none; }
.vt #hb-tasks { display: flex; }

.tcard { flex: 1; flex-direction: column; padding: 8px 9px; }
.tcard.ask { border-color: rgba(239, 159, 39, 0.7); }
.tcard .chead { margin-bottom: 2px; }
.tcount { font-size: 11px; line-height: 14px; color: #6B7280; white-space: nowrap; }
.tcount b { font-weight: 600; }
.tcount .q { color: var(--warn); }
.tcount .r { color: #4C9AFF; }
.tlist { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }

.task { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-top: 1px solid #1F252D; cursor: pointer; }
.task:first-child { border-top: 0; }
.task .tx { min-width: 0; flex: 1; }
.tn { font-size: 13px; line-height: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ts { font-size: 11px; line-height: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task.run .ts b { color: #4C9AFF; font-weight: 600; }
.task.done .ts b { color: var(--ok); font-weight: 600; }
.task.done .tn { color: #AEB6BF; font-weight: 400; }

/* Ícone: logo do provedor + estado (anel girando, ? ou ✓). */
.tico { position: relative; flex: none; width: 26px; height: 26px; margin-top: 2px; }
.tico svg.logo { position: absolute; left: 5px; top: 5px; width: 16px; height: 16px; }
.tico .spin { position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(76, 154, 255, 0.18); border-top-color: #4C9AFF; will-change: transform; animation: spin 1.1s linear infinite; }
.tico .badge { position: absolute; right: -3px; bottom: -3px; width: 14px; height: 14px; border-radius: 50%; font: 700 10px/14px var(--sans); text-align: center; color: #0F1216; }
.task.ask .tico { border-radius: 50%; background: rgba(239, 159, 39, 0.14); }
.task.ask .badge { background: var(--warn); }
.task.done .badge { background: var(--ok); }
.task.done svg.logo { opacity: 0.55; }

/* Pergunta pendente: caixa âmbar com o texto. */
.task.ask { margin: 2px 0 4px; padding: 6px 7px; border: 1px solid rgba(239, 159, 39, 0.7); border-radius: 9px; background: #1B1915; position: relative; }
.task.ask + .task { border-top: 0; }
.task.ask::after { content: ""; position: absolute; left: -1px; top: -1px; right: -1px; bottom: -1px; border-radius: 9px; border: 2px solid var(--warn); opacity: 0; animation: askpulse 2.2s ease-in-out infinite; pointer-events: none; }
@keyframes askpulse { 0%, 100% { opacity: 0; } 50% { opacity: 0.75; } }
.task.ask .ts { color: var(--warn); }
.tq { margin-top: 3px; font-size: 12.5px; line-height: 16px; color: var(--text); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.tq.cmd { font-family: var(--mono); font-size: 11.5px; color: #F2CC8F; -webkit-line-clamp: 2; }

.tfoot { display: flex; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 4px; font-size: 11px; line-height: 14px; color: #6B7280; white-space: nowrap; }
.tempty { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 6px; color: var(--muted); font-size: 14px; text-align: center; }
.tempty svg { width: 30px; height: 30px; fill: none; stroke: #3A4048; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tempty small { font-size: 12px; color: #6B7280; }

.hoff .task .spin, .toff .task .spin { animation: none; border-top-color: #59616B; border-color: #2A3038; }
.hoff .task.ask, .toff .task.ask { border-color: var(--panel-border); background: #141920; }
.hoff .task.ask::after, .toff .task.ask::after { display: none; }
.hoff .task .badge, .toff .task .badge { background: #59616B; }
.hoff .ts, .hoff .task.run .ts b, .hoff .task.done .ts b, .hoff .task.ask .ts, .toff .ts, .toff .task.run .ts b, .toff .task.done .ts b, .toff .task.ask .ts { color: var(--muted); }
.hoff .tcard.ask, .toff .tcard.ask { border-color: var(--panel-border); }
.hoff .tcount .q, .hoff .tcount .r, .toff .tcount .q, .toff .tcount .r { color: var(--muted); }

/* ---------- Aviso no topo (pergunta nova ou tarefa concluída) ---------- */
.tbanner { position: absolute; left: 0; right: 0; top: 6px; bottom: 6px; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 0 10px 0 12px; border-radius: 12px; border: 1px solid; opacity: 0; transform: translateY(-70px); transition: transform 0.35s cubic-bezier(0.34, 1.3, 0.64, 1), opacity 0.25s; pointer-events: none; cursor: pointer; }
.tbanner.on { opacity: 1; transform: none; pointer-events: auto; }
.tbanner.ask { background: #221B10; border-color: var(--warn); }
.tbanner.done { background: #102016; border-color: var(--ok); }
.tbanner .tico { width: 36px; height: 36px; margin: 0; border-radius: 50%; }
.tbanner .tico svg.logo { left: 8px; top: 8px; width: 20px; height: 20px; }
.tbanner .tico .badge { width: 17px; height: 17px; font-size: 12px; line-height: 17px; right: -3px; bottom: -3px; }
.tbanner.ask .tico { background: rgba(239, 159, 39, 0.16); }
.tbanner.ask .badge { background: var(--warn); }
.tbanner.done .tico { background: rgba(63, 185, 80, 0.14); }
.tbanner.done .badge { background: var(--ok); }
.tbanner .tx { min-width: 0; flex: 1; }
.tbanner .k { font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbanner.ask .k { color: var(--warn); }
.tbanner.done .k { color: var(--ok); }
.tbanner .m { margin-top: 2px; font-size: 19px; line-height: 24px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbanner .go { flex: none; height: 38px; padding: 0 14px; border: 1px solid var(--panel-border); border-radius: 10px; background: #171B21; color: var(--text); font: 600 14px var(--sans); cursor: pointer; }
.tbanner .x { flex: none; width: 38px; height: 38px; padding: 11px; border: 1px solid var(--panel-border); border-radius: 10px; background: #171B21; color: var(--muted); cursor: pointer; }
.tbanner .x svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }

/* ---------- Tela da tarefa (toque numa tarefa ou em "Ver") ---------- */
#tdetail { position: absolute; left: 350px; z-index: 2; top: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 232px minmax(0, 1fr); column-gap: 8px; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.25s, visibility 0s 0.25s; }
.texp #tdetail { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity 0.3s 0.05s, visibility 0s; }
.texp .hmain { visibility: hidden; pointer-events: none; }
#tdetail .card { display: flex; flex-direction: column; padding: 8px 10px; }
.tall { overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.tall::-webkit-scrollbar { width: 4px; }
.tall::-webkit-scrollbar-thumb { background: #3A4048; border-radius: 3px; }
.tall .sec { margin: 6px 0 2px; }
.tall .sec:first-child { margin-top: 0; }
.tall .task { padding: 6px 6px; margin: 0 -4px; border-radius: 8px; border-top: 0; }
.tall .task.sel { background: #1F2A38; }
.tall .task.ask { margin: 2px -4px 4px; }
.tall .task.ask.sel { background: #2A2111; }

.tdcard .chead { justify-content: flex-start; gap: 10px; margin-bottom: 8px; }
.tdcard .back { width: auto; height: 36px; padding: 0 12px; font-size: 14px; flex: none; }
.tdhead { display: flex; gap: 10px; align-items: center; }
.tdhead .tico { width: 34px; height: 34px; margin: 0; }
.tdhead .tico svg.logo { left: 8px; top: 8px; width: 18px; height: 18px; }
.tdhead .tico .spin { width: 34px; height: 34px; }
.tdname { font-size: 18px; line-height: 22px; font-weight: 600; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.tdmeta { font-size: 12px; line-height: 16px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tdbody { margin-top: 10px; flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.tdbody .sec { margin: 8px 0 4px; }
.tdbody .sec:first-child { margin-top: 0; }
.tdq { font-size: 18px; line-height: 24px; color: var(--text); }
.tdq.ask { padding: 8px 10px; border-left: 3px solid var(--warn); background: #1B1915; border-radius: 0 8px 8px 0; }
.tdcmd { padding: 8px 10px; border-radius: 8px; background: #0B0E12; border: 1px solid #2A3038; font: 13px/18px var(--mono); color: #F2CC8F; white-space: pre-wrap; overflow-wrap: anywhere; }
.tdtext { font-size: 14px; line-height: 20px; color: #AEB6BF; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 6; overflow: hidden; }
.topts { display: flex; flex-wrap: wrap; gap: 6px; }
.topts span { padding: 6px 12px; border: 1px dashed #3A4048; border-radius: 9px; color: var(--muted); font-size: 14px; }
.tsoon { margin-top: 6px; font-size: 11px; color: #6B7280; }
.tfacts { margin-top: 10px; }

/* ---------- Visão Tarefas: IA mais estreita, saúde em uma coluna de 3 e lista larga ---------- */
/* Larguras: IA 300 · saúde 244 · tarefas ~378 (antes: 340 · 4 mostradores · 239). */
/* Termômetro perto do mostrador: IA em 270 px, a lista de tarefas fica com ~408 px. */
.lb.vt .columns { grid-template-columns: 270px minmax(0, 1fr); }
.lb.vt .column { grid-template-columns: 200px 60px; column-gap: 0; padding: 4px 6px 6px 2px; }
.lb.vt .thermo { margin-left: -4px; }
.lb.vt .gwrap { align-items: flex-start; }
.lb.vt .reset { align-self: center; }
.lb.vt .hmain { grid-template-columns: 244px minmax(0, 1fr); }
/* CPU em cima, ocupando a largura toda; memória e disco lado a lado num só cartão. */
.vt .hrow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1.55fr) minmax(0, 1fr); column-gap: 0; }
.vt .hrow .hcell { overflow: hidden; }
.vt #hb-clk { display: none; }

/* CPU: mostrador maior, com o GHz no centro, e gráfico do dia mais alto. */
.vt #hb-cpu { grid-column: 1 / 3; padding: 4px 8px 6px; }
.vt #hb-cpu .hdial { width: 190px; height: 152px; }
.vt #hb-cpu .t { margin-top: -6px; }
.vt #hb-cpu .hspark { flex: 1; min-height: 0; display: flex; align-items: flex-end; margin-top: 4px; }
.vt #hb-cpu .spark { height: 100%; max-height: 40px; min-height: 20px; }
.ghz { display: none; }
.vt .ghz { display: inline; }
.vt #hb-cpu [data-d="hub"] { display: none; }
.hoff .ghz text { fill: var(--muted); }

/* Memória + disco: as duas metades formam um cartão; sem títulos, só o espaço livre.
   O gráfico do dia é só o da memória, na largura do cartão. */
.vt #hb-ram { border-right: 0; border-radius: 12px 0 0 12px; overflow: visible; z-index: 1; padding: 6px 2px 36px 8px; }
.vt #hb-disk { border-left: 0; border-radius: 0 12px 12px 0; padding: 6px 8px 36px 2px; }
.vt #hb-ram .hdial, .vt #hb-disk .hdial { width: 112px; height: 90px; }
.vt #hb-ram .t, .vt #hb-disk .t { display: none; }
.vt #hb-ram .s, .vt #hb-disk .s { margin-top: 0; font-size: 12px; color: var(--text); }
.vt #hb-disk .hspark { display: none; }
.vt #hb-ram .hspark { position: absolute; left: 10px; bottom: 8px; width: calc(200% - 20px); margin: 0; }
.vt #hb-ram .spark { height: 22px; }
.vt #hb-ram::after { content: ""; position: absolute; right: 0; top: 14px; bottom: 40px; width: 1px; background: #1F252D; }

/* Telas sobrepostas começam logo depois da IA. */
.vt .detail, .vt #tdetail { left: 280px; }
.vt #tdetail { grid-template-columns: 262px minmax(0, 1fr); }

/* Coluna da direita alinhada ao topo dos cartões da IA e da saúde. */
.vt .health-side { padding-top: 0; }
/* Todos os cartões 3 px abaixo do topo: no Echo Show a escala cortava a borda de cima (a vermelha dos alertas aparecia). */
.lb.vt .columns, .vt .detail, .vt #tdetail { top: 3px; }

/* Tokens: contagem na lista e na tela da tarefa; tokens/s nos mostradores (só na visão Tarefas). */
.tk { font-family: var(--mono); font-size: 10.5px; color: var(--text); }
.task.done .tk { color: #AEB6BF; }
.hoff .tk, .toff .tk { color: var(--muted); }
.tokbox { display: flex; gap: 6px; }
.tokbox div { flex: 1; min-width: 0; padding: 5px 8px; border: 1px solid #2A3038; border-radius: 8px; background: #11161C; }
.tokbox b { display: block; font: 600 17px/22px var(--mono); color: var(--text); }
.tokbox span { display: block; font-size: 10.5px; line-height: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gauge svg { overflow: visible; }
.tps { display: none; }
.vt .tps { display: inline; }
/* Logo menor (40 → 30) e centro menor (raio 27 → 22): sobra espaço para o % e os tokens/s. */
.vt .gauge .provider-logo { transform: translate(65px, 57px) scale(1.25); }
.vt .gauge circle[r="27"] { r: 22px; }
.vt .ring { width: 32.2%; margin-left: -16.1%; margin-top: -16.1%; }
.vt .gauge [data-v="readout"] { font-size: 20px; transform: translateY(-7px); }

/* Selo de tokens na lista: raio e cor própria (violeta), à direita da tarefa. */
/* Pílula: raio, último pedido (verde) | conversa toda (azul). */
.tchip { flex: none; align-self: center; display: flex; align-items: center; gap: 4px; padding: 2px 8px 2px 5px; border: 1px solid rgba(179, 146, 240, 0.4); border-radius: 999px; background: #161B22; color: var(--text); font: 700 12px/16px var(--mono); white-space: nowrap; }
.tchip svg { width: 12px; height: 12px; fill: #B392F0; }
.tchip .tl { color: #56D364; }
.tchip .tt { color: #79B8FF; }
.tchip .tsep { width: 1px; height: 11px; background: #3A4048; }
.task.done .tchip { border-color: rgba(179, 146, 240, 0.22); background: #141920; }
.task.done .tchip .tl { color: #3FB950; }
.task.done .tchip .tt { color: #5A9BEA; }
.task.ask .tchip { align-self: flex-start; margin-top: 1px; }
.hoff .task .tchip, .toff .task .tchip { border-color: var(--panel-border); background: none; color: var(--muted); }
.hoff .task .tchip svg, .toff .task .tchip svg { fill: var(--muted); }
.hoff .task .tchip .tl, .hoff .task .tchip .tt, .toff .task .tchip .tl, .toff .task .tchip .tt { color: var(--muted); }

/* Tela da tarefa: cartões de token coloridos (tokens violeta, velocidade ciano, limite amarelo). */
.tokbox .kt { border-color: rgba(179, 146, 240, 0.55); background: rgba(179, 146, 240, 0.12); }
.tokbox .kt b { display: flex; align-items: center; gap: 4px; color: #C9B3FF; }
.tokbox .kt b svg { width: 15px; height: 15px; fill: #B392F0; flex: none; }
/* Tela da tarefa: o cartão violeta com os dois números (último pedido e conversa toda). */
.tokbox .kt { flex: 1.7; display: flex; gap: 10px; }
.tokbox .kt .kv { flex: 1; min-width: 0; padding: 0; border: 0; background: none; }
.tokbox .kt .kv b.tl { color: #56D364; }
.tokbox .kt .kv b.tt { color: #79B8FF; }
.tokbox .kt .kv + .kv { padding-left: 10px; border-left: 1px solid rgba(179, 146, 240, 0.3); }
.toff .tokbox .kt .kv b { color: var(--muted); }
.tokbox .ks { border-color: rgba(57, 197, 207, 0.55); background: rgba(57, 197, 207, 0.10); }
.tokbox .ks b { color: #56D4DD; }
.tokbox .kl { border-color: rgba(232, 212, 77, 0.5); background: rgba(232, 212, 77, 0.08); }
.tokbox .kl b { color: #E8D44D; }
.tokbox span { color: #9AA4AF; }
.tall .tchip { display: inline-flex; margin-top: 3px; padding: 1px 7px 1px 4px; font-size: 11px; line-height: 15px; }

/* Tarefa concluída (visão Tarefas): aviso no meio da lista que fica ~3 s, sobe e some em ~5 s.
   Só transform/opacity. Tocar enquanto aparece abre a tarefa. */
.health-side { position: relative; }
.tpops { position: absolute; left: 0; right: 0; top: 54px; bottom: 0; pointer-events: none; overflow: hidden; border-radius: 12px; z-index: 3; }
.tpop { position: absolute; left: 50%; top: 50%; width: 86%; padding: 10px 12px; border: 1px solid var(--ok); border-radius: 14px;
  background: #0F2116; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55), 0 0 0 4px rgba(63, 185, 80, 0.12);
  display: flex; gap: 10px; align-items: center; pointer-events: auto; cursor: pointer; will-change: transform, opacity;
  animation: tpopLife 10.4s cubic-bezier(0.33, 0, 0.4, 1) forwards; }
.tpop .tico { width: 36px; height: 36px; margin: 0; border-radius: 50%; background: rgba(63, 185, 80, 0.16); }
.tpop .tico svg.logo { left: 8px; top: 8px; width: 20px; height: 20px; }
.tpop .tico .badge { width: 17px; height: 17px; font-size: 12px; line-height: 17px; background: var(--ok); }
.tpop .tx { min-width: 0; flex: 1; }
.tpop .k { font-size: 10.5px; line-height: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--ok); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tpop .m { margin: 2px 0 5px; font-size: 16px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tpop .tchip { display: inline-flex; }
.tpop .hint { margin-left: 6px; font-size: 10.5px; color: #8FB8FF; }
/* Pergunta nova: o mesmo aviso, em âmbar; a linha da lista continua destacada enquanto espera. */
.tpop.ask { border-color: var(--warn); background: #221B10; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55), 0 0 0 4px rgba(239, 159, 39, 0.14); }
.tpop.ask .tico { background: rgba(239, 159, 39, 0.16); }
.tpop.ask .tico .badge { background: var(--warn); }
.tpop.ask .k { color: var(--warn); }
.tpop.ask .hint { margin-left: 0; }
/* 10,4 s: aparece (0,4 s), fica parado 4,8 s e sobe sumindo em 5,2 s. */
@keyframes tpopLife {
  0% { opacity: 0; transform: translate(-50%, -30%) scale(0.92); }
  3.85% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  50% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -210%) scale(0.98); }
}
.tokbox b span { display: inline; font: inherit; color: inherit; }
/* Mostrador do Claude/Codex um pouco menor na visão Tarefas, para o tok/s não encostar na linha do reset. */
.lb.vt .gauge { width: 200px; height: 160px; }
.lb.vt .reset { margin-top: 4px; }

/* Custo equivalente (rosa): na lista, a conversa; no aviso de concluída, o pedido; na tela da tarefa, os dois. */
.tusd { color: #F778BA; font-family: var(--mono); font-size: 10.5px; }
.task.done .tusd { color: #D16BA0; }
.hoff .tusd, .toff .tusd { color: var(--muted); }
.tcost { display: flex; gap: 6px; margin-top: 6px; }
.tcost div { flex: 1; min-width: 0; padding: 5px 8px; border: 1px solid rgba(247, 120, 186, 0.5); border-radius: 8px; background: rgba(247, 120, 186, 0.08); }
.tcost b { display: block; font: 600 17px/22px var(--mono); color: #F778BA; }
.tcost span { display: block; font-size: 10.5px; line-height: 13px; color: #9AA4AF; }
.toff .tcost b { color: var(--muted); }
.tpop .pusd { margin-left: 6px; font: 700 12px/16px var(--mono); color: #F778BA; }

/* Lista de tarefas da tela principal com a fonte 50% maior (a lista da tela da tarefa continua igual). */
#hb-tasks .chead { margin-bottom: 4px; }
#hb-tasks .tcount { font-size: 16.5px; line-height: 20px; }
#hb-tasks .task { gap: 10px; padding: 7px 0; }
#hb-tasks .task.ask { padding: 7px 8px; }
#hb-tasks .tn { font-size: 19.5px; line-height: 24px; }
#hb-tasks .ts { font-size: 16.5px; line-height: 21px; }
#hb-tasks .tusd { font-size: 15.5px; }
#hb-tasks .tq { margin-top: 3px; font-size: 18.5px; line-height: 23px; -webkit-line-clamp: 2; }
#hb-tasks .tq.cmd { font-size: 17px; }
#hb-tasks .tico { width: 32px; height: 32px; margin-top: 3px; }
#hb-tasks .tico svg.logo { left: 7px; top: 7px; width: 18px; height: 18px; }
#hb-tasks .tico .spin { width: 32px; height: 32px; }
#hb-tasks .tico .badge { width: 16px; height: 16px; font-size: 11px; line-height: 16px; }
/* A pílula fica numa linha própria, embaixo do estado: o nome e o estado usam a largura toda. */
#hb-tasks .tchip { display: inline-flex; margin-top: 4px; gap: 5px; padding: 3px 10px 3px 7px; font-size: 18px; line-height: 22px; }
#hb-tasks .tchip svg { width: 17px; height: 17px; }
#hb-tasks .tchip .tsep { height: 16px; }
#hb-tasks .tfoot { font-size: 16.5px; line-height: 20px; }
#hb-tasks .tempty { font-size: 21px; }
#hb-tasks .tempty small { font-size: 18px; }

/* Gráfico do dia da CPU (visão Tarefas): grade de 0 a 100% com os rótulos à esquerda. */
.vt #hb-cpu .hspark { position: relative; flex: 1 1 auto; min-height: 24px; max-height: 46px; padding-left: 30px; margin-top: 4px; }
.vt #hb-cpu .spark { height: 100%; max-height: none; min-height: 0; }
.vt #hb-cpu .hspark::before, .vt #hb-cpu .hspark::after { position: absolute; left: 0; width: 27px; text-align: right; font: 600 9.5px/10px var(--sans); color: #6B7280; }
.vt #hb-cpu .hspark::before { content: "100%"; top: -3px; }
.vt #hb-cpu .hspark::after { content: "0%"; bottom: -4px; }

/* ---------- Ajustes: sino de alertas, lista com rolagem, ícone maior, grade da CPU ---------- */
/* Grade do gráfico da CPU: só as linhas (sem rótulos). */
.vt #hb-cpu .hspark { padding-left: 0; }
.vt #hb-cpu .hspark::before, .vt #hb-cpu .hspark::after { content: none; }

/* Ícone do Claude/Codex maior na lista de tarefas. */
#hb-tasks .tico { width: 42px; height: 42px; margin-top: 2px; }
#hb-tasks .tico svg.logo { left: 9px; top: 9px; width: 24px; height: 24px; }
#hb-tasks .tico .spin { width: 42px; height: 42px; border-width: 2.5px; }
#hb-tasks .tico .badge { width: 18px; height: 18px; font-size: 12px; line-height: 18px; right: -3px; bottom: -3px; }

/* Visão Tarefas: sem a faixa de alertas; o sino no topo, à direita do "Atualizado". */
.bell { display: none; position: relative; flex: none; width: 44px; height: 44px; margin-left: 10px; padding: 10px; border: 1px solid var(--panel-border); border-radius: 12px; background: #171B21; color: var(--muted); cursor: pointer; touch-action: manipulation; }
.vt .bell { display: inline-block; }
.bell .bicon svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bell.warn { color: var(--warn); border-color: rgba(239, 159, 39, 0.7); background: #1B1915; }
.bell.danger { color: var(--danger); border-color: rgba(226, 75, 74, 0.8); background: #1B1416; }
.bell:active { background: #2A3038; }
.bcount { position: absolute; top: -7px; right: -7px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--warn); color: #0F1216; font: 700 12px/20px var(--sans); text-align: center; }
.bell.danger .bcount { background: var(--danger); color: #fff; }
.vt .health-open { display: none; }
.vt .health-side { gap: 0; }
.vt .tpops { top: 0; }

/* Lista de tarefas com rolagem pelo dedo. */
#hb-tasks .tlist { overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding-right: 6px; margin-right: -4px; }
#hb-tasks .tlist::-webkit-scrollbar { width: 5px; }
#hb-tasks .tlist::-webkit-scrollbar-thumb { background: #3A4048; border-radius: 3px; }

/* Linha da tarefa na tela principal: grade com o ícone à esquerda, o título (até 2 linhas) e os tokens
   empilhados à direita; a pergunta e o estado (hora, duração e custo) usam a largura toda embaixo. */
#hb-tasks .task.trow { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; grid-template-areas: "ico tn tok" "ico tq tq" "ico ts ts"; column-gap: 10px; row-gap: 2px; align-items: start; }
#hb-tasks .trow .tico { grid-area: ico; }
#hb-tasks .trow .tn { grid-area: tn; white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
#hb-tasks .trow .tq { grid-area: tq; }
#hb-tasks .trow .ts { grid-area: ts; }
#hb-tasks .tstack { grid-area: tok; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; padding: 3px 8px; border: 1px solid rgba(179, 146, 240, 0.4); border-radius: 10px; background: #161B22; font: 700 17px/21px var(--mono); white-space: nowrap; }
#hb-tasks .tstack b { display: flex; align-items: center; gap: 4px; font-weight: 700; }
#hb-tasks .tstack .tl { color: #56D364; }
#hb-tasks .tstack .tt { color: #79B8FF; }
#hb-tasks .tstack svg { width: 15px; height: 15px; fill: #B392F0; }
#hb-tasks .task.done .tstack { border-color: rgba(179, 146, 240, 0.22); background: #141920; }
#hb-tasks .task.done .tstack .tl { color: #3FB950; }
#hb-tasks .task.done .tstack .tt { color: #5A9BEA; }
.hoff #hb-tasks .tstack b, .toff#hb-tasks .tstack b, #hb-tasks.toff .tstack b { color: var(--muted); }
.hoff #hb-tasks .tstack svg, #hb-tasks.toff .tstack svg { fill: var(--muted); }

/* Linha da tarefa: título e estado na coluna do meio; tokens e custo num bloco à direita, que pode ser mais
   alto que o texto; a pergunta (quando há) usa a largura toda embaixo. */
#hb-tasks .task.trow { grid-template-areas: "ico tn tok" "ico ts tok" "ico tq tok"; grid-template-rows: auto auto auto; }
#hb-tasks .trow .ts { align-self: start; }
#hb-tasks .tstack .tc { color: #F778BA; }
#hb-tasks .task.done .tstack .tc { color: #D16BA0; }
.hoff #hb-tasks .tstack .tc, #hb-tasks.toff .tstack .tc { color: var(--muted); }
#hb-tasks .tcheck { display: inline-block; margin-right: 6px; color: var(--ok); font-weight: 700; }
#hb-tasks .twork { display: inline-block; width: 14px; height: 14px; margin: 0 7px -1px 1px; border-radius: 50%; border: 2.5px solid rgba(76, 154, 255, 0.25); border-top-color: #4C9AFF; will-change: transform; animation: spin 0.9s linear infinite; }
.hoff #hb-tasks .tcheck, #hb-tasks.toff .tcheck { color: var(--muted); }
.hoff #hb-tasks .twork, #hb-tasks.toff .twork { animation: none; border-color: #2A3038; border-top-color: #59616B; }

/* Compacta a linha da tarefa: a 3ª faixa (pergunta) só existe quando há pergunta; ícone menor (30 px) e
   bloco dos tokens mais baixo, para caber mais tarefas e dar mais largura ao texto. */
#hb-tasks .task.trow { grid-template-columns: 30px minmax(0, 1fr) auto; grid-template-areas: "ico tn tok" "ico ts tok"; grid-template-rows: auto auto; column-gap: 8px; row-gap: 1px; padding: 5px 0; }
#hb-tasks .task.trow.hasq { grid-template-areas: "ico tn tok" "ico ts tok" "ico tq tok"; grid-template-rows: auto auto auto; }
#hb-tasks .task.trow.ask { padding: 5px 7px; }
#hb-tasks .trow .tn { line-height: 23px; }
#hb-tasks .trow .ts { line-height: 20px; }
#hb-tasks .trow .tico { width: 30px; height: 30px; margin-top: 1px; }
#hb-tasks .trow .tico svg.logo { left: 6px; top: 6px; width: 18px; height: 18px; }
#hb-tasks .trow .tico .spin { width: 30px; height: 30px; border-width: 2px; }
#hb-tasks .trow .tico .badge { width: 14px; height: 14px; font-size: 10px; line-height: 14px; right: -3px; bottom: -3px; }
#hb-tasks .tstack { gap: 0; padding: 2px 7px; border-radius: 9px; font-size: 15.5px; line-height: 19px; }
#hb-tasks .tstack svg { width: 13px; height: 13px; }

/* Linha da tarefa em flex: ícone, texto (título, estado e pergunta empilhados, sem vão) e o bloco dos
   tokens à direita; a altura é a maior entre o texto e o bloco. */
#hb-tasks .task.trow, #hb-tasks .task.trow.hasq { display: flex; align-items: flex-start; gap: 8px; }
#hb-tasks .trow .tx { flex: 1; min-width: 0; }
#hb-tasks .trow .tstack { flex: none; }

/* Ícone do Claude/Codex centralizado na altura da tarefa. */
#hb-tasks .trow .tico { align-self: center; margin-top: 0; }

/* Anel "executando" na cor da ferramenta, como o anel "em uso" dos mostradores: laranja Claude, verde Codex. */
.task .tico.p-claude .spin, .tbanner .tico.p-claude .spin, .tdhead .tico.p-claude .spin { border-color: rgba(217, 119, 87, 0.22); border-top-color: #D97757; }
.task .tico.p-codex .spin, .tbanner .tico.p-codex .spin, .tdhead .tico.p-codex .spin { border-color: rgba(16, 163, 127, 0.25); border-top-color: #10A37F; }
.hoff .task .tico .spin, .toff .task .tico .spin, .toff .tdhead .tico .spin { border-color: #2A3038; border-top-color: #59616B; }

/* Executando: ampulheta (parada) na cor da ferramenta, no lugar da bolinha girando. */
#hb-tasks .twork { width: 15px; height: 15px; margin: 0 6px -2px 0; border: 0; border-radius: 0; animation: none; }
#hb-tasks .twork svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
#hb-tasks .twork.p-claude { color: #D97757; }
#hb-tasks .twork.p-codex { color: #10A37F; }
.hoff #hb-tasks .twork, #hb-tasks.toff .twork { color: var(--muted); }

/* CPU (visão Tarefas): percentual no centro, sem a legenda "GHz"; a velocidade fica embaixo, menor. */
.vt #hb-cpu [data-d="ghzu"] { display: none; }
.vt #hb-cpu [data-d="ghz"] { font-size: 19px; transform: translateY(6px); }
.vt #hb-cpu [data-d="readout"] { font-size: 17px; }
.hoff .ghz [data-d="ghz"] { fill: var(--muted); }
/* ---------- Tarefa sem ícone: logo em marca d'água, fundo na cor da ferramenta e bolinha de executando ---------- */
#hb-tasks .trow .tx { position: relative; }
#hb-tasks .trow .tn, #hb-tasks .trow .ts, #hb-tasks .trow .tq { position: relative; z-index: 1; }
/* Logo grande e apagado, alinhado à direita do texto (antes da caixa dos tokens), centrado na altura. */
#hb-tasks .tbg { position: absolute; right: 2px; top: 50%; width: 58px; height: 58px; margin-top: -29px; opacity: 0.16; pointer-events: none; z-index: 0; }
#hb-tasks .tbg svg { display: block; width: 100%; height: 100%; }
#hb-tasks .task.done .tbg { opacity: 0.09; }
#hb-tasks .task.ask .tbg { opacity: 0.12; }
.hoff #hb-tasks .tbg, #hb-tasks.toff .tbg { opacity: 0.07; filter: grayscale(1); }

/* Fundo leve na cor da ferramenta (laranja Claude Code, verde Codex); a pergunta mantém a caixa âmbar. */
#hb-tasks .task.trow.pv-claude, #hb-tasks .task.trow.pv-codex { margin: 4px 0; padding: 6px 8px; border-top: 0; border-radius: 10px; }
#hb-tasks .task.trow.pv-claude { background: rgba(217, 119, 87, 0.10); box-shadow: inset 3px 0 0 rgba(217, 119, 87, 0.55); }
#hb-tasks .task.trow.pv-codex { background: rgba(16, 163, 127, 0.11); box-shadow: inset 3px 0 0 rgba(16, 163, 127, 0.6); }
#hb-tasks .task.trow.done.pv-claude { background: rgba(217, 119, 87, 0.06); box-shadow: inset 3px 0 0 rgba(217, 119, 87, 0.3); }
#hb-tasks .task.trow.done.pv-codex { background: rgba(16, 163, 127, 0.06); box-shadow: inset 3px 0 0 rgba(16, 163, 127, 0.3); }
#hb-tasks .task.trow.ask { background: #1B1915; box-shadow: none; }
#hb-tasks .task.trow:first-child { margin-top: 0; }
.hoff #hb-tasks .task.trow, #hb-tasks.toff .task.trow { background: #141920; box-shadow: none; }

/* Executando: bolinha na cor da ferramenta, pulsando devagar (forte e fraca). */
#hb-tasks .tpulse { display: inline-block; width: 11px; height: 11px; margin: 0 8px 0 2px; border-radius: 50%; vertical-align: 0; will-change: opacity, transform; animation: tpulse 2.4s ease-in-out infinite; }
#hb-tasks .tpulse.p-claude { background: #D97757; box-shadow: 0 0 6px rgba(217, 119, 87, 0.7); }
#hb-tasks .tpulse.p-codex { background: #10A37F; box-shadow: 0 0 6px rgba(16, 163, 127, 0.7); }
@keyframes tpulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.25; transform: scale(0.8); } }
.hoff #hb-tasks .tpulse, #hb-tasks.toff .tpulse { animation: none; background: #59616B; box-shadow: none; }
/* O texto ocupa a altura toda do card: o logo em marca d'água (top 50%) fica no meio do card, mesmo
   quando o bloco dos tokens é mais alto que o texto. */
#hb-tasks .trow .tx { align-self: stretch; }
/* Executando: bolinha vermelha em todas as tarefas (Claude Code e Codex), pulsando devagar. */
#hb-tasks .tpulse, #hb-tasks .tpulse.p-claude, #hb-tasks .tpulse.p-codex { background: #E24B4A; box-shadow: 0 0 7px rgba(226, 75, 74, 0.75); }
.hoff #hb-tasks .tpulse, #hb-tasks.toff .tpulse { background: #59616B; box-shadow: none; }

/* Aviso de concluída ou de pergunta: a lista atrás escurece enquanto ele fica parado (só opacidade). */
.tpops::before { content: ""; position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 12px; background: rgba(5, 7, 10, 0.74); opacity: 0; transition: opacity 0.45s ease; }
.tpops.dim::before { opacity: 1; }

/* Sem ajustes: o visual é o do painel local. */

</style>
</head>
<body>
  <main class="panel">
    <section id="login" class="login" aria-labelledby="login-title">
      <div class="login-copy">
        <div class="login-brand">USAGE IA COCKPIT</div>
        <h1 id="login-title">Seu painel,<br>protegido.</h1>
        <p>Digite seu PIN para ver o consumo.<br>Este aparelho fica conectado por 30 dias.</p>
        <p id="login-message" class="login-message" role="status" aria-live="polite">Verificando acesso…</p>
        <button id="lock-retry" class="login-submit" type="button" hidden>Tentar bloquear novamente</button>
      </div>
      <form id="login-form" class="login-form">
        <label for="pin">PIN de acesso</label>
        <input id="pin" type="password" inputmode="numeric" pattern="[0-9]{8,12}" minlength="8" maxlength="12" autocomplete="off" readonly required aria-describedby="login-message" aria-label="PIN de acesso, use o teclado abaixo">
        <div id="keypad" class="keypad" role="group" aria-label="Teclado numérico">
          <button type="button" data-digit="1" disabled>1</button><button type="button" data-digit="2" disabled>2</button><button type="button" data-digit="3" disabled>3</button>
          <button type="button" data-digit="4" disabled>4</button><button type="button" data-digit="5" disabled>5</button><button type="button" data-digit="6" disabled>6</button>
          <button type="button" data-digit="7" disabled>7</button><button type="button" data-digit="8" disabled>8</button><button type="button" data-digit="9" disabled>9</button>
          <button id="pin-clear" type="button" disabled>Limpar</button><button type="button" data-digit="0" disabled>0</button><button id="pin-back" type="button" aria-label="Apagar último dígito" disabled>Apagar</button>
        </div>
        <button id="login-submit" class="login-submit" type="submit" disabled>Entrar</button>
      </form>
      <noscript>Ative o JavaScript do navegador para entrar no painel.</noscript>
    </section>
    <div id="cockpit" class="cockpit" hidden>
    <header class="top">
      <div class="status status-summary">
        <span id="dot" class="dot"></span>
        <div class="status-copy">
          <span id="updated">carregando…</span>
          <time id="last-updated" class="last-updated" title="Última consulta bem-sucedida à API" hidden></time>
        </div>
        <!-- Visão Tarefas: o sino substitui a faixa de alertas; o contador mostra quantos há. -->
        <button id="bell" class="bell" type="button" aria-label="Ver alertas"><span class="bicon"></span><span id="bell-count" class="bcount" hidden>0</span></button>
      </div>
      <div class="clock-wrap"><div id="clock" class="clock">--:--</div><div id="date" class="date">---, -- de ---</div></div>
      <div class="status right">
        <button id="lock" class="fs" type="button" aria-label="Bloquear painel" title="Bloquear painel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
        </button>
        <button id="refresh" class="refresh" type="button" aria-label="Atualizar agora" title="Atualizar agora">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8M21 3v5h-5"/></svg>

// Só toca no DOM quando o valor muda: o processador do aparelho é fraco.
function set(col, key, node, prop, value) {
  if (col.last[key] === value) return;
  col.last[key] = value;
  if (prop === 'text') node.textContent = value;
  else if (prop === 'd') node.setAttribute('d', value);
  else if (prop === 'fill') node.setAttribute('fill', value);
  else if (prop === 'class') node.classList.toggle('on', value);
  else if (prop === 'className') node.className = value;
  else node.style[prop] = value;

    col.warn.setAttribute('d', visible && s > WARN_FROM ? arc(R, angleOf(WARN_FROM), angleOf(Math.min(s, DANGER_FROM))) : '');

    g.shown = value;
    g.paint(g, value, performance.now());
    return;

    g.shown = 0;

    g.gaugeReady = true;

function paintArcs(d, s) {

// Mostrador da saúde no layout B: quadro a quadro, com o mesmo tremor dos ponteiros da IA.

// Histórico do dia, guardado no Redis pela API (um ponto por envio do PC, ~15 s) e mantido aqui só
// em memória. Cada ponto: [ms do servidor, cpu, ram, disco, MHz]. since = último ponto vindo da API,
// para a próxima leitura trazer só os novos (inclusive os de quando a página ficou oculta).
var DAY_GAP_MS = 180000, DAY_BINS = 150;

}

  if (t.date !== day.date) day = { date: t.date, start: t.start, end: t.end, since: 0, points: [] };
  t.points.forEach(function (p) {
    if (!Array.isArray(p) || num(p[0]) === null || p[0] < day.start || p[0] >= day.end) return;
    addDayPoint([p[0], num(p[1]), num(p[2]), num(p[3]), num(p[4])]);
    if (p[0] > day.since) day.since = p[0];
  });
}
// A leitura do ciclo entra no gráfico na hora; virando o dia, pede o histórico novo na próxima consulta.
function recordDay(resp, v) {

  var t = Date.parse(resp.receivedAt);

// Do primeiro ponto do dia até agora, em até 150 faixas (média de cada faixa). A linha só se

function daySpark(col, k, color) {

    '<line x1="0" y1="21.5" x2="150" y2="21.5" stroke="' + C.track + '" stroke-width="1" vector-effect="non-scaling-stroke"/>';
  // CPU e memória: grade com o topo (100%), o meio (50%) e a base (0%), para ler a altura da linha.
  if (col === DAY_COL.cpu || col === DAY_COL.ram) s += '<line class="sg" x1="0" y1="2" x2="150" y2="2" stroke="' + C.hubRim + '" stroke-width="1" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>' +
    '<line class="sg" x1="0" y1="11" x2="150" y2="11" stroke="' + C.hubRim + '" stroke-width="1" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/>' +
    '<line class="sg" x1="0" y1="20" x2="150" y2="20" stroke="' + C.hubRim + '" stroke-width="1" vector-effect="non-scaling-stroke"/>';

    prev = bin;

  if (cur.length) segs.push(cur);
  segs.forEach(function (seg) {
    if (seg.length === 1) seg.push([Math.min(w, seg[0][0] + 1.5), seg[0][1]]);
    var line = seg.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
    s += '<polygon class="sf" points="' + seg[0][0].toFixed(1) + ',' + h + ' ' + line + ' ' + seg[seg.length - 1][0].toFixed(1) + ',' + h + '" fill="' + color + '" fill-opacity="0.14"/>' +
      '<polyline class="sl" points="' + line + '" fill="none" stroke="' + color + '" stroke-width="1.5" vector-effect="non-scaling-stroke"/>';
  });

}

}

var CHECK_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>';
var MAIN_ALERTS = 3, MAIN_PROCS = 5, processSort = 'mem';

function renderHealth() {

  // Cinza com o PC offline e também em espera (a última leitura fica parada na tela).

  if (hp.last.off !== off) {

  // mostrador de velocidade; memória e disco mostram só o espaço livre.
  var vt = tasksView(), clk = v.metrics.clk;
  HMETRICS.forEach(function (m) {
    var mv = v.metrics[m.id], mn = hp.main[m.id], g = mn.g;
    var subWarn = !!mv.warnText || (vt && m.id === 'cpu' && !!clk.warnText);
    var sub = v.has ? mv.mini : '--';
    if (vt && v.has && m.id === 'cpu' && clk.mini !== '--') sub = mv.mini + ' · ' + clk.mini;
    else if (vt && v.has && (m.id === 'ram' || m.id === 'disk')) sub = mv.mini.replace(/ de \d+$/, '');
    // CPU na visão Tarefas: o percentual vai para o centro (cor da faixa) e a velocidade (GHz, azul) desce
    // para o lugar da leitura. Na visão Mais pesados, o centro mostra o GHz e a leitura o percentual.
    var cpuVt = vt && m.id === 'cpu';
    if (mn.dial.ghz) {
      set(mn.dial, 'ghz', mn.dial.ghz, 'text', cpuVt ? (mv.has ? mv.readout : '--') : clk.has ? clk.readout : '--');
      set(mn.dial, 'ghzFill', mn.dial.ghz, 'fill', cpuVt && mv.has ? mv.color : C.text);
    }
    // Principal: ponteiro animado (parado offline ou sem dados), leitura e textos.
    g.offline = off;
    updateHealthTarget(g, mv.pct, mv.has);
    set(mn.dial, 'hub', mn.dial.hub, 'text', mv.hub);
    set(mn.dial, 'readout', mn.dial.readout, 'text', cpuVt ? (clk.has ? clk.readout + ' GHz' : '--') : mv.has ? mv.readout : '--');
    set(mn.dial, 'readoutFill', mn.dial.readout, 'fill', cpuVt ? (clk.has ? C.weekBlue : C.tick) : mv.has ? mv.color : C.tick);
    set(mn, 'title', mn.title, 'text', mv.title);
    set(mn, 'sub', mn.sub, 'text', sub);
    set(mn, 'subWarn', mn.sub, 'className', 's' + (subWarn ? ' w' : ''));
    set(mn, 'flag', mn.warn, 'className', 'hwarn' + (mv.flag || (vt && m.id === 'cpu' && clk.flag) ? ' on' : ''));
    var spark = daySpark(DAY_COL[m.id], m.k, mv.has ? mv.color : C.tick);
    if (mn.last.spark !== spark) { mn.last.spark = spark; mn.spark.innerHTML = spark; }
  });

  // Botão "Ver todos os alertas": sempre visível no cartão de Alertas; a borda indica a gravidade.
  var n = v.alerts.length;
  set(hp, 'openCls', hp.open, 'className', 'health-open' + (n ? (v.danger ? ' danger' : ' warn') : ''));
  var label = 'Ver todos os alertas' + (v.has ? ' (' + n + ')' : '');
  if (hp.last.label !== label) { hp.last.label = label; hp.open.setAttribute('aria-label', label); }
  set(hp, 'aTitle', hp.aTitle, 'text', v.has ? 'Alertas · ' + n : 'Alertas');

  var note = '';
  if (!resp) note = !health.failed ? 'Carregando…' : health.status === 404 ? 'A API ainda não tem a rota /v1/panel.' : 'Sem conexão com a API.';

  // Situação da leitura (rodapé do cartão inicial e cabeçalho da tela de alertas).
  var foot = v.offline ? 'PC offline · ' + ago(resp.receivedAt) : off ? 'em espera' : '';
  if (health.failed && resp) foot = 'sem conexão' + (foot ? ' · ' + foot : '');

  // Principal: os 3 mais graves; "+N alertas no detalhe" abre a tela com todos.
  var html, extra = n - MAIN_ALERTS;
  if (note) html = '<div class="hnote">' + note + '</div>';
  else if (!v.has) html = '<div class="hnote">Sem dados de saúde<small>Ative o monitoramento da saúde no app desktop.</small></div>';
  else if (!n) html = '<div class="hnote ok">' + CHECK_ICON + 'Nenhum alerta. Tudo certo com o PC.</div>';
  else html = v.alerts.slice(0, MAIN_ALERTS).map(alertItem).join('');
  if (foot || extra > 0) {
    html += '<div class="afoot">' + (foot ? '<span' + (health.failed ? ' class="e"' : '') + '>' + esc(foot) + '</span>' : '<span></span>') +
      (extra > 0 ? '<button class="amore" type="button">+' + extra + (extra === 1 ? ' alerta' : ' alertas') + ' no detalhe</button>' : '') + '</div>';
  }
  setHtml('aMain', hp.aList, html);

  // Tela de alertas: todos, do mais grave ao menos grave, com título e ação legíveis.
  set(hp, 'alTitle', hp.alTitle, 'text', v.has ? 'Todos os alertas · ' + n : 'Alertas');
  hp.statusText = foot;
  hp.statusError = health.failed && !!resp;
  if (note) html = '<div class="hnote">' + note + '</div>';
  else if (!v.has) html = '<div class="hnote">Sem dados de saúde<small>Ative "Monitorar a saúde do PC" e "Enviar a saúde para a API" no app desktop.</small></div>';
  else if (!n) html = '<div class="hnote ok big">' + CHECK_ICON + 'Nenhum alerta</div>';
  else html = v.alerts.map(alertItem).join('');
  set(hp, 'alDense', hp.alList, 'className', 'al-list' + (n > 6 ? ' dense' : ''));
  setHtml('alList', hp.alList, html);
  // Detalhes que a tela inicial não mostra: os 5 mais pesados e os números do sistema.
  if (note) html = '<div class="hnote">' + note + '</div>';
  else if (!v.has) html = '<div class="hnote">sem dados de saúde</div>';
  else {
    html = '<div class="sec">Mais pesados</div><div class="proc head"><span>app</span><span class="v">CPU</span><span class="v">RAM</span></div>' +
      (v.procs.length ? v.procs.map(procRow).join('') : '<div class="hnote">--</div>') +
      '<div class="sec">Sistema</div>' + v.facts.map(function (f) {
        return '<div class="fact' + (f.level ? ' ' + f.level : '') + '"><span>' + f.label + '</span><b>' + esc(f.value) + '</b></div>';
      }).join('');
  }
  setHtml('info', hp.info, html);
  paintAlStatus();

  // Ordena os processos recebidos sem alterar os dados usados nos indicadores.
  var sorted = v.procs.slice().sort(function (a, b) {
    var av = a[processSort], bv = b[processSort];
    if (av === null) return bv === null ? 0 : 1;
    if (bv === null) return -1;
    return bv - av;
  });
  html = '<div class="sec">Mais pesados</div><div class="proc-sort" role="group" aria-label="Ordenar processos por">' +
    '<button type="button" data-sort="mem" aria-pressed="' + (processSort === 'mem') + '">Memória</button>' +
    '<button type="button" data-sort="cpu" aria-pressed="' + (processSort === 'cpu') + '">Processador</button></div>' +
    '<div class="proc head"><span>app</span><span class="v">CPU</span><span class="v">RAM</span></div>' +
    (sorted.length ? sorted.slice(0, MAIN_PROCS).map(procRow).join('') : '<div class="hnote">--</div>') + chipsHtml(v.chips);
  setHtml('pMain', hp.pList, html);
}

// Cabeçalho da lista: situação da leitura e, se a lista passar da altura, o aviso de rolagem.
function paintAlStatus() {
  var l = hp.alList, scroll = l.scrollHeight > l.clientHeight + 1;

function setExpanded(on) {

function resetHealth() {
  health.data = null;
