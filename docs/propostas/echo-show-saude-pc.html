<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Protótipo · Saúde do PC no Echo Show</title>
<style>
/* Protótipo estático: mesmo tema e palco de 960×480 do painel usage-ia-cockpit-echo-show. */
:root {
  --panel: #0F1216; --panel-border: #2D333B; --muted: #8B949E; --text: #D0D7DE; --dim: #6B7280;
  --warn: #EF9F27; --ok: #3FB950; --danger: #E24B4A; --blue: #4C9AFF; --card: #141920;
  --mono: "Cascadia Mono", Consolas, "Roboto Mono", "DejaVu Sans Mono", monospace;
  --sans: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: var(--text); font-family: var(--sans); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }

.panel { position: absolute; left: 0; top: 0; width: 960px; height: 480px; transform-origin: 0 0; padding: 4px 18px 14px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }

/* ---------- Topo (igual ao painel atual) ---------- */
.top { height: 72px; flex-shrink: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; }
.btns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btns .note { flex-basis: 100%; font-size: 11px; color: var(--muted); margin-top: 3px; }
.ib { width: 44px; height: 44px; padding: 11px; border: 1px solid var(--panel-border); border-radius: 10px; background: #171B21; color: var(--text); }
.ib svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.clock-wrap { text-align: center; line-height: 1; }
.clock { font-family: var(--mono); font-weight: 600; font-size: 46px; letter-spacing: 1px; }
.clock small { font-size: 17px; color: var(--muted); letter-spacing: 0; }
.date { margin-top: 3px; color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .8px; }
.status { display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 16px; color: var(--muted); white-space: nowrap; }
.status .sub { display: block; font-family: var(--mono); font-size: 11px; color: var(--dim); margin-top: 4px; text-align: right; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
.offline .dot { background: var(--warn); }

/* ---------- Gauges ---------- */
.g svg { display: block; width: 100%; height: 100%; }
.needle { transition: transform .9s cubic-bezier(.34, 1.4, .64, 1); }
.offline .needle { transition: none; }
.offline .hg svg, .offline .hcell svg, .offline .spark { filter: grayscale(1); opacity: .75; }

/* ---------- Modo normal: IA | faixa de saúde | IA ---------- */
.stage { flex: 1; min-height: 0; position: relative; }
.columns { position: absolute; inset: 0; display: flex; justify-content: center; align-items: flex-start; transition: opacity .25s, transform .35s; transform-origin: 0 100%; }
.column { width: 372px; display: flex; flex-direction: column; align-items: center; }
.column .g { width: 340px; height: 272px; }
.reset { font-size: 20px; color: var(--muted); margin: 0 0 16px; }
.reset b { font-weight: 400; color: var(--text); }
.week { width: 340px; }
.week-row { display: flex; justify-content: space-between; font-size: 20px; color: var(--muted); margin-bottom: 6px; }
.week-row .pct { font-family: var(--mono); }
.bar { position: relative; height: 14px; border-radius: 4px; overflow: hidden; background: linear-gradient(to right, #23282F 0 60%, rgba(232,212,77,.25) 60% 80%, rgba(214,51,132,.25) 80% 100%); }
.bar span { position: absolute; top: 0; bottom: 0; left: 0; background: var(--blue); }

/* A antiga linha divisória vira a faixa de saúde. */
.strip { width: 132px; align-self: stretch; margin: 6px 4px 0; padding: 0 10px; border-left: 1px solid var(--panel-border); border-right: 1px solid var(--panel-border); display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
.hg { width: 108px; height: 86px; position: relative; }
.hg .warn-ico { position: absolute; right: -4px; top: 0; width: 18px; height: 18px; }
.expand { width: 112px; height: 38px; margin-bottom: 2px; border: 1px solid var(--panel-border); border-radius: 10px; background: #171B21; color: var(--text); font: 600 14px var(--sans); display: flex; align-items: center; justify-content: center; gap: 6px; }
.expand svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.expand.alert { border-color: rgba(239,159,39,.7); color: var(--warn); }
.expand.danger { border-color: rgba(226,75,74,.8); color: #FF7B72; }
.expand:active, .back:active { background: #2A3038; }

/* ---------- Modo expandido ---------- */
.detail { position: absolute; inset: 0; display: grid; grid-template-columns: 188px 1fr; gap: 14px; opacity: 0; pointer-events: none; transition: opacity .3s .1s; }
.expanded .detail { opacity: 1; pointer-events: auto; }
.expanded .columns { opacity: 0; transform: scale(.32); pointer-events: none; }

/* IA recolhida no canto esquerdo. */
.ai-mini { background: var(--card); border: 1px solid var(--panel-border); border-radius: 12px; padding: 8px 8px 10px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; transform: scale(.85); transform-origin: 0 100%; transition: transform .35s; }
.expanded .ai-mini { transform: none; }
.ai { display: flex; flex-direction: column; align-items: center; }
.ai .g { width: 128px; height: 102px; }
.ai .line { font-size: 13px; color: var(--muted); margin-top: -2px; }
.ai .line b { font-family: var(--mono); font-weight: 600; }
.back { width: 100%; height: 40px; border: 1px solid var(--panel-border); border-radius: 10px; background: #171B21; color: var(--text); font: 600 14px var(--sans); display: flex; align-items: center; justify-content: center; gap: 6px; }
.back svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.health { display: grid; grid-template-rows: 166px 1fr; gap: 10px; min-height: 0; }
.hrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.hcell { background: var(--card); border: 1px solid var(--panel-border); border-radius: 12px; padding: 4px 10px 6px; display: flex; flex-direction: column; align-items: center; position: relative; }
.hcell .g { width: 122px; height: 98px; }
.hcell .t { font-size: 14px; font-weight: 600; margin-top: -4px; }
.hcell .s { font-size: 12px; color: var(--muted); white-space: nowrap; }
.hcell .s.w { color: var(--warn); }
.hcell .warn-ico { position: absolute; right: 8px; top: 8px; width: 18px; height: 18px; }
.spark { width: 100%; height: 22px; margin-top: 3px; display: block; }

.lower { display: grid; grid-template-columns: 1.3fr 1fr; gap: 10px; min-height: 0; }
.card { background: var(--card); border: 1px solid var(--panel-border); border-radius: 12px; padding: 8px 12px; min-height: 0; overflow: hidden; }
.card h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .8px; text-transform: uppercase; display: flex; justify-content: space-between; }
.card h3 span { text-transform: none; letter-spacing: 0; color: var(--dim); font-weight: 400; }
.alert-item { display: grid; grid-template-columns: 10px 1fr; gap: 8px; padding: 5px 0; border-top: 1px solid #1F252D; }
.alert-item:first-of-type { border-top: 0; }
.alert-item i { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; }
.alert-item .a { font-size: 14px; font-weight: 600; line-height: 1.25; }
.alert-item .b { font-size: 12px; color: var(--muted); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.more { font-size: 12px; color: var(--dim); padding-top: 3px; }
.empty { display: flex; align-items: center; gap: 10px; color: var(--ok); font-size: 15px; padding: 18px 4px; }
.proc { display: grid; grid-template-columns: 1fr 44px 58px; gap: 6px; font-size: 13px; padding: 3px 0; align-items: center; }
.proc .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proc .n small { color: var(--dim); }
.proc .v { font-family: var(--mono); text-align: right; color: var(--muted); }
.proc.head { font-size: 11px; color: var(--dim); padding: 0 0 2px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
.chip { font-size: 12px; padding: 3px 7px; border-radius: 999px; background: #1B222C; color: var(--muted); border: 1px solid var(--panel-border); }
.chip b { color: var(--text); font-weight: 600; }
.chip.w { border-color: rgba(239,159,39,.55); }
.chip.w b { color: var(--warn); }

/* ---------- Barra do protótipo (fora do palco do aparelho) ---------- */
.demo { position: fixed; left: 0; right: 0; bottom: 0; height: 44px; display: flex; gap: 8px; align-items: center; justify-content: center; font: 13px var(--sans); color: var(--muted); background: #0A0C0F; border-top: 1px solid #1F252D; }
.demo button { font: 13px var(--sans); color: var(--text); background: #171B21; border: 1px solid var(--panel-border); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.demo button.on { border-color: var(--blue); color: #fff; }
</style>
</head>

<main id="panel" class="panel">
  <header class="top">
    <div class="btns">
      <span class="ib"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></span>

      <span class="note">Áudio e tela ativos</span>

    <div class="clock-wrap"><div id="clock" class="clock">--:--</div><div id="date" class="date">---</div></div>
    <div class="status"><span class="dot"></span><span><span id="updated">Atualizado agora</span><span class="sub" id="last">--</span></span></div>
  </header>

  <section class="stage">
    <!-- Modo normal -->
    <div id="columns" class="columns">
      <div class="column" id="col-claude"></div>
      <aside class="strip" id="strip"></aside>
      <div class="column" id="col-codex"></div>
    </div>
    <!-- Modo expandido -->
    <div id="detail" class="detail" aria-hidden="true">
      <div class="ai-mini" id="ai-mini"></div>
      <div class="health">
        <div class="hrow" id="hrow"></div>
        <div class="lower">
          <div class="card" id="alerts"></div>
          <div class="card" id="procs"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="demo">Cenário:
  <button data-s="today" class="on">Como estava hoje</button>
  <button data-s="healthy">Saudável</button>
  <button data-s="offline">PC offline</button>
  <span style="margin-left:14px">Toque no botão da faixa central para expandir</span>
</div>

      { id: 'disk', hub: 'C:', title: 'Disco C:', pct: 98, readout: '98%', warn: 85, danger: 95, sub: '6,6 GB livres de 279 GB', hist: series(97, 1, 48, 2) },
      { id: 'clk', hub: 'GHz', title: 'Velocidade', pct: 33, readout: '1,6', warn: null, sub: 'modo eficiência na tomada', subWarn: true, flag: true, hist: series(33, 3, 48, 5), scale: ['0', '2,5', '5'] }
    ],
    alerts: [
      { lv: 'danger', a: 'Disco C: com 2% livre', b: 'Limpe Temp e caches ou mova arquivos para o D:' },
      { lv: 'warn', a: 'Modo de energia em eficiência na tomada', b: 'A CPU não passa de 1,7 GHz: mude para Equilibrado' },
      { lv: 'warn', a: 'Memória comprometida em 82%', b: 'Chrome 14,5 GB e node 7,6 GB: feche o que não usa' },
      { lv: 'warn', a: 'Ligado há 12 dias', b: 'Reinicie para liberar 2,4 GB presos no kernel' },
      { lv: 'warn', a: '47 processos esquecidos do Codex', b: 'Feche e reabra o app do Codex' }
    ],
    procs: [['Chrome', 46, 32, 14.5], ['node', 50, 3, 7.6], ['Claude', 14, 2, 3.4], ['ChatGPT', 15, 1, 3.3], ['Bitdefender', 7, 2, 2.5]],
    chips: [['Ligado', '12d 22h', true], ['Proc.', '643', true], ['Kernel', '2,4 GB', true]]
  },
  healthy: {
    metrics: [
      { id: 'cpu', hub: 'CPU', title: 'Processador', pct: 18, readout: '18%', warn: 70, danger: 90, sub: 'média dos últimos 5 min', hist: series(22, 14, 48, 4) },
      { id: 'ram', hub: 'RAM', title: 'Memória', pct: 46, readout: '46%', warn: 75, danger: 90, sub: '17,1 GB livres de 32 GB', hist: series(44, 6, 48, 8) },
      { id: 'disk', hub: 'C:', title: 'Disco C:', pct: 71, readout: '71%', warn: 85, danger: 95, sub: '81 GB livres de 279 GB', hist: series(71, 1, 48, 1) },
      { id: 'clk', hub: 'GHz', title: 'Velocidade', pct: 68, readout: '3,4', warn: null, sub: 'modo equilibrado', hist: series(62, 12, 48, 6), scale: ['0', '2,5', '5'] }
    ],
    alerts: [],
    procs: [['Chrome', 22, 6, 5.1], ['Claude', 6, 2, 1.8], ['Code', 9, 1, 1.2], ['Teams', 5, 1, 0.9], ['Bitdefender', 7, 1, 0.8]],
    chips: [['Ligado', '1d 3h'], ['Proc.', '312'], ['Kernel', '0,4 GB']]
  }
};
SCENARIOS.offline = SCENARIOS.today;

var LEVEL = function (m) { return m.warn == null ? C.blue : m.pct >= m.danger ? C.danger : m.pct >= m.warn ? C.warn : C.ok; };
var scenario = 'today', expanded = false;
var panel = document.getElementById('panel');

function sparkSvg(m) {
  var w = 150, h = 22, n = m.hist.length, pts = m.hist.map(function (v, i) { return (i * w / (n - 1)).toFixed(1) + ',' + (h - 2 - v / 100 * (h - 4)).toFixed(1); });
  var c = LEVEL(m);
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none"><polygon points="0,' + h + ' ' + pts.join(' ') + ' ' + w + ',' + h + '" fill="' + c + '" fill-opacity=".14"/>' +
    '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + c + '" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>';
}

function aiGauge(id, mini) {
  var p = AI[id], prov = id === 'claude' ? { brand: '#D97757', fill: '#D97757', logo: LOGO_CLAUDE } : { brand: '#10A37F', fill: C.text, logo: LOGO_OPENAI };
  var col = p.session < 60 ? C.ok : p.session < 80 ? C.warn : C.danger;
  return gauge({ pct: p.session, warn: 60, danger: 80, color: prov.brand, logo: prov.logo, logoFill: prov.fill, readout: p.session + '%', readoutColor: col });
}

function render() {
  var s = SCENARIOS[scenario], offline = scenario === 'offline';
  panel.classList.toggle('offline', offline);
  document.getElementById('updated').textContent = offline ? 'PC offline · último envio há 14 min' : 'Atualizado agora';

  // Colunas de IA (modo normal)
  ['claude', 'codex'].forEach(function (id) {
    var p = AI[id];
    document.getElementById('col-' + id).innerHTML = '<div class="g">' + aiGauge(id) + '</div>' +
      '<div class="reset">5h · <b>reseta em ' + p.sessionReset + '</b></div>' +
      '<div class="week"><div class="week-row"><span>semana · reseta ' + p.weekReset + '</span><span class="pct" style="color:#4C9AFF">' + p.week + '%</span></div>' +
      '<div class="bar"><span style="width:' + p.week + '%"></span></div></div>';
  });

  // Faixa de saúde: 4 mini mostradores + botão
  var html = s.metrics.map(function (m) {
    return '<div class="hg g">' + gauge({ pct: m.pct, warn: m.warn, danger: m.danger, color: C.blue, hub: m.hub, readout: m.readout, readoutColor: LEVEL(m), mini: true }) + (m.flag ? WARN_ICON : '') + '</div>';
  }).join('');
  var dangers = s.alerts.filter(function (a) { return a.lv === 'danger'; }).length;
  var cls = !s.alerts.length ? '' : dangers ? ' danger' : ' alert';
  var label = s.alerts.length ? '<svg viewBox="0 0 24 24"><path d="M12 3 2 21h20L12 3zM12 10v5M12 18v.5"/></svg>' + s.alerts.length + ' alertas' : '<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Saúde';
  html += '<button class="expand' + cls + '" id="expand" type="button" aria-label="Abrir saúde do PC">' + label + '</button>';
  document.getElementById('strip').innerHTML = html;
  document.getElementById('expand').onclick = function () { setExpanded(true); };

  // IA recolhida
  document.getElementById('ai-mini').innerHTML = ['claude', 'codex'].map(function (id) {
    var p = AI[id];
    return '<div class="ai"><div class="g">' + aiGauge(id) + '</div><div class="line">semana <b style="color:#4C9AFF">' + p.week + '%</b> · ' + p.weekReset + '</div></div>';
  }).join('') + '<button class="back" id="back" type="button"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>Voltar</button>';
  document.getElementById('back').onclick = function () { setExpanded(false); };

  // Indicadores completos
  document.getElementById('hrow').innerHTML = s.metrics.map(function (m) {
    return '<div class="hcell"><div class="g">' + gauge({ pct: m.pct, warn: m.warn, danger: m.danger, color: C.blue, hub: m.hub, readout: m.readout, readoutColor: LEVEL(m), scale: m.scale }) + '</div>' +
      (m.flag ? WARN_ICON : '') + '<div class="t">' + m.title + '</div><div class="s' + (m.subWarn ? ' w' : '') + '">' + m.sub + '</div>' + sparkSvg(m) + '</div>';
  }).join('');

  var MAX_ALERTS = 3;
  var shown = s.alerts.slice(0, MAX_ALERTS);
  document.getElementById('alerts').innerHTML = '<h3>Alertas <span>' + (s.alerts.length ? s.alerts.length + ' ativos' : '') + '</span></h3>' +
    (s.alerts.length ? shown.map(function (a) {
      return '<div class="alert-item"><i style="background:' + (a.lv === 'danger' ? C.danger : C.warn) + '"></i><div><div class="a">' + a.a + '</div><div class="b">' + a.b + '</div></div></div>';
    }).join('') + (s.alerts.length > MAX_ALERTS ? '<div class="more">+' + (s.alerts.length - MAX_ALERTS) + ' alertas · toque para ver todos</div>' : '')
      : '<div class="empty"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3FB950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>Nenhum alerta. Tudo certo com o PC.</div>');

  document.getElementById('procs').innerHTML = '<h3>Mais pesados <span>24 h</span></h3>' +
    '<div class="proc head"><span>app</span><span class="v">CPU</span><span class="v">RAM</span></div>' +
    s.procs.slice(0, 4).map(function (p) {
      return '<div class="proc"><span class="n">' + p[0] + ' <small>×' + p[1] + '</small></span><span class="v">' + p[2] + '%</span><span class="v">' + String(p[3]).replace('.', ',') + ' GB</span></div>';
    }).join('') +
    '<div class="chips">' + s.chips.map(function (c) { return '<span class="chip' + (c[2] ? ' w' : '') + '">' + c[0] + ' <b>' + c[1] + '</b></span>'; }).join('') + '</div>';

  sweep(offline);
}

// Ponteiros sobem do zero até o valor, como na atualização manual do painel.
function sweep(offline) {
  var needles = document.querySelectorAll('.needle');
  for (var i = 0; i < needles.length; i++) {
    var n = needles[i];
    if (offline) { n.style.transform = 'rotate(' + n.getAttribute('data-to') + 'deg)'; continue; }
    n.style.transform = 'rotate(135deg)';
  }
  if (offline) return;
  requestAnimationFrame(function () { requestAnimationFrame(function () {
    for (var j = 0; j < needles.length; j++) needles[j].style.transform = 'rotate(' + needles[j].getAttribute('data-to') + 'deg)';
  }); });
}

function setExpanded(v) {
  expanded = v;
  panel.classList.toggle('expanded', v);
  document.getElementById('detail').setAttribute('aria-hidden', String(!v));
  sweep(scenario === 'offline');
}

// Relógio
var DAYS = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'], MONTHS = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];
function pad(n) { return (n < 10 ? '0' : '') + n; }
function tick() {
  var d = new Date();
  document.getElementById('clock').innerHTML = pad(d.getHours()) + ':' + pad(d.getMinutes()) + '<small>' + pad(d.getSeconds()) + '</small>';
  document.getElementById('date').textContent = DAYS[d.getDay()] + ', ' + d.getDate() + ' de ' + MONTHS[d.getMonth()];
  document.getElementById('last').textContent = pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() + ' · ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
setInterval(tick, 1000); tick();

// Escala o palco de 960×480 para caber na janela (deixa espaço para a barra do protótipo).
function fit() {
  var demoH = window.innerHeight > 560 ? 44 : 0;
  document.querySelector('.demo').style.display = demoH ? 'flex' : 'none';
  var k = Math.min(window.innerWidth / 960, (window.innerHeight - demoH) / 480);
  panel.style.transform = 'translate(' + ((window.innerWidth - 960 * k) / 2) + 'px,' + ((window.innerHeight - demoH - 480 * k) / 2) + 'px) scale(' + k + ')';
}
window.addEventListener('resize', fit); fit();

Array.prototype.forEach.call(document.querySelectorAll('.demo button'), function (b) {
  b.onclick = function () {
    scenario = b.getAttribute('data-s');
    Array.prototype.forEach.call(document.querySelectorAll('.demo button'), function (x) { x.classList.toggle('on', x === b); });
    render();
  };
});
render();
</script>
